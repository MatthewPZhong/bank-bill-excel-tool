/* Gemini reskin — extras for modals & dialogs.
   Targets the real class names from src/renderer-dialogs.js:
   .modal-overlay, .modal-card, .dialog-header, .dialog-title, .icon-close,
   .table-wrapper, .data-table, .dialog-actions, .manager-card, .mapping-card,
   .account-card, .alert-card, .big-account-card, .balance-addon-card */

/* Modal overlay + card — sized to match real styles.css */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(32,33,36,.32);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 28px;
  z-index: 50;
}
.modal-card {
  background: var(--panel, #fff);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  box-shadow: 0 22px 60px rgba(0,0,0,.18);
  display: flex; flex-direction: column;
  overflow: hidden;
  width: min(100%, 940px);
  max-height: calc(100vh - 56px);
}
.manager-card { min-height: 360px; }
.mapping-card { width: min(100%, 1120px); }
.account-card { width: min(100%, 920px); }
.big-account-card { width: min(100%, 980px); }
.balance-addon-card { width: min(100%, 1120px); }
.alert-card { width: min(100%, 420px); }

.big-account-unmaintained-alert {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 56px);
}

.big-account-unmaintained-alert .alert-body {
  min-height: 0;
  overflow-y: auto;
}

.big-account-unmaintained-alert .dialog-actions {
  flex-shrink: 0;
}

/* Dialog header */
.dialog-header {
  display: flex; align-items: center;
  padding: 22px 28px 16px;
  border-bottom: 1px solid var(--line-soft);
  gap: 16px;
}
.dialog-title {
  font-family: "Google Sans", sans-serif;
  font-size: 22px; font-weight: 500; letter-spacing: -0.01em;
  flex: 0 0 auto;
}
.dialog-header-checkboxes {
  display: flex; align-items: center; gap: 16px;
  margin-left: 16px;
  font-size: 13px; color: var(--muted);
}
.dialog-checkbox-label {
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer;
}
.dialog-checkbox-label input { accent-color: var(--primary); }
.account-mapping-template-select-wrapper {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 14px; color: var(--muted);
}
.account-mapping-template-select-wrapper select {
  height: 36px; padding: 0 14px;
  border-radius: var(--pill);
  border: 1px solid var(--line);
  background: var(--panel, #fff);
  font-size: 14px; color: var(--text);
  appearance: none;
  padding-right: 36px;
  background-image: var(--select-arrow);
  background-size: 12px;
  background-repeat: no-repeat;
  background-position: right 12px center;
}
.icon-close {
  margin-left: auto;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none; background: var(--chip-bg);
  color: var(--muted); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-close:hover { background: var(--line, #e6eaf0); color: var(--text); }

/* Table */
.table-wrapper {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}
.mapping-wrapper { padding-bottom: 16px; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.data-table thead th {
  text-align: left;
  font-size: 12px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted);
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
}
.data-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover td { background: var(--bg-soft); }
.data-table tbody tr:last-child td { border-bottom: none; }

/* Left-align action column (列头与第一按钮左缘对齐 td 内边距) */
.manager-action-header { text-align: left; }
.manager-action-header-label { display: block; width: auto; margin: 0; }
.manager-row-actions,
.big-account-row-actions {
  width: auto;
  margin: 0;
  justify-content: flex-start;
}
.row-actions,
.account-mapping-action-cell {
  text-align: left;
  white-space: nowrap;
}
.row-actions .text-action,
.account-mapping-action-cell .text-action {
  padding: 6px 10px; font-size: 13px;
  margin-left: 4px;
}
.manager-row-actions .text-action:first-child,
.big-account-row-actions .text-action:first-child,
.row-actions .text-action:first-child,
.account-mapping-action-cell .text-action:first-child {
  margin-left: 0;
  padding-left: 0;
}
.text-action.danger { color: var(--danger); }
.text-action.danger:hover { background: var(--danger-soft, #fce8e6); color: var(--danger); }

td .muted { color: var(--muted); }

/* Mapping-specific */
.mapping-section-row td {
  background: var(--bg-soft) !important;
  padding: 10px 16px !important;
  border-bottom: 1px solid var(--line-soft) !important;
}
.mapping-section-row strong {
  font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--primary);
}
.mapping-wrapper .data-table tbody td {
  padding: 10px 16px;
}
.mapping-wrapper .mapping-select {
  height: 40px;
  background-color: var(--panel, #fff);
}

/* Dialog actions footer */
.dialog-actions {
  display: flex; align-items: center;
  padding: 16px 28px 22px;
  border-top: 1px solid var(--line-soft);
  background: var(--bg-soft);
  gap: 10px;
}
.dialog-actions.right { justify-content: flex-end; }
.dialog-actions.center { justify-content: center; }
.dialog-actions.split { justify-content: space-between; }
.dialog-actions.vertical {
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  padding: 8px 28px 22px;
}
.big-account-footer-left { display: flex; gap: 8px; }

/* =================== Card size presets for new dialogs =================== */
.export-scope-card { width: min(100%, 480px); }
.monthly-balance-export-card { width: min(100%, 520px); }
.manual-balance-card { width: min(100%, 560px); }
.template-rename-card { width: min(100%, 520px); }
.remember-order-mismatch-card { width: min(100%, 460px); }
.app-update-settings-card {
  --app-settings-footer-inline-padding: 24px;
  --app-settings-confirm-width: 72px;
  --app-update-pane-inline-padding: 36px;
  width: min(1088px, calc(100vw - 56px));
  height: min(704px, calc(100vh - 56px));
  min-height: 0;
  overflow: hidden;
}
.account-mapping-migration-card { width: min(100%, 900px); }
.amount-split-rules-card { width: min(100%, 880px); }
.bill-split-mappings-card { width: 80vw; max-width: 1280px; }
.bill-split-rows-card { width: min(100%, 1180px); }
/* v2.1.7 round 2 R6a 方案 C：弹窗 1080 → 1200（spec §8.7.3 — 给文件名 + 后缀 ' → MERCHANT USD' 多 120px 横向空间） */
.big-account-selection-card { width: min(100%, 1200px); min-height: 540px; }
.big-account-selection-split { min-height: 600px; }

.app-settings-header {
  flex: 0 0 66px;
  padding: 0 22px 0 26px;
}
.app-settings-layout {
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: grid;
  grid-template-columns: 176px minmax(0, 1fr);
}
.app-settings-nav {
  min-height: 0;
  border-right: 1px solid var(--line-soft);
  background: var(--bg-soft);
  padding: 16px 10px;
}
.app-settings-nav-item {
  width: 100%;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  cursor: pointer;
  text-align: left;
}
.app-settings-nav-item + .app-settings-nav-item { margin-top: 4px; }
.app-settings-nav-item:hover { background: var(--row-hover, #edf1f6); color: var(--text); }
.app-settings-nav-item.is-active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
}
.app-settings-nav-icon {
  width: 20px;
  text-align: center;
  font-size: 16px;
}
.app-settings-nav-dot {
  width: 8px;
  height: 8px;
  margin-left: auto;
  border-radius: 50%;
  background: var(--danger);
}
.app-settings-main {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel, #fff);
}
.app-settings-pane {
  min-width: 0;
  min-height: 0;
  flex: 1;
}
.app-settings-pane-heading {
  margin: 0;
  color: var(--text);
  font-family: "Google Sans", "Microsoft YaHei", sans-serif;
  font-size: 20px;
  font-weight: 500;
}
.app-settings-pane-subtitle {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.app-settings-footer {
  flex: 0 0 66px;
  min-height: 66px;
  padding: 0 var(--app-settings-footer-inline-padding);
  flex-wrap: nowrap;
}
.app-settings-footer [data-role="close-update-dialog"] {
  width: var(--app-settings-confirm-width);
  min-width: var(--app-settings-confirm-width);
}
.app-settings-footer-group {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.app-update-pane {
  height: 100%;
  overflow: hidden;
}
.app-update-pane-scroll {
  height: 100%;
  overflow-y: auto;
  padding: 30px var(--app-update-pane-inline-padding);
}
.app-update-settings-body {
  display: grid;
  gap: 0;
  width: calc(
    100%
    - var(--app-settings-footer-inline-padding)
    - var(--app-settings-confirm-width)
    + var(--app-update-pane-inline-padding)
  );
  margin-top: 24px;
  padding: 0 0 18px;
  border-top: 1px solid var(--line-soft);
}
.app-update-settings-row {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-bottom: 1px solid var(--line-soft);
}
.app-update-settings-row:last-child { border-bottom: 0; }
.app-update-settings-label {
  color: var(--muted);
  font-size: 14px;
}
.app-update-settings-value {
  min-width: 0;
  color: var(--text);
  font-size: 14px;
  text-align: right;
  overflow-wrap: anywhere;
}
.app-update-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.app-update-toggle input {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
}
.app-update-progress {
  grid-column: 1 / -1;
  width: 100%;
  height: 8px;
  margin: 0 0 14px;
  accent-color: var(--primary);
}
.app-update-settings-note {
  width: calc(
    100%
    - var(--app-settings-footer-inline-padding)
    - var(--app-settings-confirm-width)
    + var(--app-update-pane-inline-padding)
  );
  margin: 0;
  padding: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.archive-center-pane {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.archive-center-feedback {
  flex: 0 0 auto;
  margin: 10px 24px 0;
  border-left: 3px solid var(--dim, #7c8797);
  background: var(--bg-soft, #f5f7fa);
  color: var(--muted, #4d5562);
  padding: 8px 11px;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.archive-center-feedback[data-tone="error"] {
  border-left-color: var(--danger);
  background: var(--danger-soft, #fce8e6);
  color: var(--danger, #8c1d18);
}
.archive-center-feedback[data-tone="success"] {
  border-left-color: var(--success);
  background: var(--success-soft, #e6f4ea);
  color: var(--success, #146c2e);
}
.archive-center-feedback[data-tone="info"] {
  border-left-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary, #174ea6);
}
.archive-center-browser {
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.archive-center-header {
  flex: 0 0 70px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
}
.archive-center-header-copy {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.archive-center-header-copy .app-settings-pane-subtitle {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.archive-center-storage-summary {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  white-space: nowrap;
  font-size: 12px;
}
.archive-center-storage-summary strong {
  color: var(--text);
  font-size: 13px;
}
.archive-center-icon-button {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted, #5e6672);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}
.archive-center-icon-button:hover:not(:disabled) {
  border-color: var(--line);
  background: var(--bg-soft);
  color: var(--text);
}
.archive-center-icon-button:disabled {
  opacity: .42;
  cursor: not-allowed;
}
.archive-center-icon-button-danger { color: var(--danger); }
.archive-center-icon-button-danger:hover:not(:disabled) {
  border-color: rgba(217, 48, 37, .25);
  background: var(--danger-soft, #fce8e6);
  color: var(--danger);
}
.archive-center-filters {
  flex: 0 0 76px;
  display: grid;
  grid-template-columns: 168px 190px minmax(220px, 1fr);
  gap: 12px;
  padding: 10px 24px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.archive-center-field {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--muted);
  font-size: 12px;
}
.archive-center-field input,
.archive-center-field select {
  width: 100%;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel, #fff);
  color: var(--text);
  padding: 0 10px;
  font: inherit;
  font-size: 13px;
}
.archive-center-field input:focus,
.archive-center-field select:focus {
  outline: 2px solid rgba(11, 87, 208, .18);
  border-color: var(--primary);
}
.archive-center-workspace {
  min-width: 0;
  min-height: 0;
  flex: 1;
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
}
.archive-center-batch-panel {
  min-height: 0;
  border-right: 1px solid var(--line-soft);
  background: var(--bg-soft, #fbfcfd);
  display: flex;
  flex-direction: column;
}
.archive-center-panel-caption {
  flex: 0 0 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--muted);
  font-size: 12px;
}
.archive-center-batch-list {
  min-height: 0;
  overflow-y: auto;
}
.archive-center-empty {
  padding: 28px 18px;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  line-height: 1.7;
}
.archive-center-batch-item {
  position: relative;
  width: 100%;
  min-height: 66px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  color: var(--text);
  padding: 10px 14px 9px 17px;
  text-align: left;
  cursor: pointer;
}
.archive-center-batch-item:hover { background: var(--row-hover, #f1f5fa); }
.archive-center-batch-item:focus-visible {
  z-index: 1;
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.archive-center-batch-item.is-active { background: var(--primary-soft, #edf4ff); }
.archive-center-batch-item.is-active::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--primary);
}
.archive-center-batch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.archive-center-batch-row + .archive-center-batch-row { margin-top: 8px; }
.archive-center-batch-row-primary strong {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.archive-center-batch-number-wrap {
  min-width: 0;
  max-width: 58%;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
}
.archive-center-batch-number-wrap [data-role="archive-batch-number"] {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted, #4d5562);
  font-size: 12px;
}
.archive-center-lock-mark {
  color: var(--primary);
  flex: 0 0 auto;
  font-size: 11px;
}
.archive-center-batch-row-secondary {
  color: var(--dim, #8a929e);
  font-size: 11px;
}
.archive-center-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 500;
}
.archive-center-status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.archive-center-status[data-status="success"] { color: var(--success); }
.archive-center-status[data-status="incomplete"] { color: var(--warning, #a15c00); }
.archive-center-status[data-status="failed"] { color: var(--danger); }
.archive-center-status[data-status="pending"] { color: var(--primary); }
.archive-center-status[data-status="neutral"] { color: var(--muted); }
.archive-center-detail {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 20px 22px;
}
.archive-center-detail-empty {
  min-height: 100%;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 13px;
}
.archive-center-detail-error { color: var(--danger); }
.archive-center-detail-heading {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.archive-center-detail-heading h4 {
  margin: 0;
  color: var(--text);
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.archive-center-detail-heading > div:first-child {
  min-width: 0;
  flex: 1;
}
.archive-center-detail-title-line {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  white-space: nowrap;
}
.archive-center-detail-title-line h4 {
  flex: 0 0 auto;
  max-width: min(210px, 42%);
}
.archive-center-related {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  overflow-x: auto;
  color: var(--muted);
  font-size: 12px;
  scrollbar-width: thin;
}
.archive-center-related > span:first-child { flex: 0 0 auto; }
.archive-center-related-batch {
  border: 0;
  background: transparent;
  color: var(--primary);
  padding: 2px;
  cursor: pointer;
  font: inherit;
}
.archive-center-related-batch:hover { text-decoration: underline; }
.archive-center-related-batch:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
  border-radius: 3px;
}
.archive-center-related-batch[aria-current="true"] {
  color: var(--text);
  font-weight: 600;
}
.archive-center-related-separator,
.archive-center-related-group-separator { flex: 0 0 auto; }
.archive-center-detail-heading p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
}
.archive-center-detail-actions {
  margin-left: auto;
  display: flex;
  gap: 3px;
}
.archive-center-metadata {
  margin: 16px 0 15px;
  padding: 12px 0;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.archive-center-metadata span,
.archive-center-metadata strong { display: block; }
.archive-center-metadata > div > span {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 11px;
}
.archive-center-metadata > div > strong {
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.archive-center-metadata .archive-center-status {
  display: inline-flex;
}
.archive-center-file-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.archive-center-file-table {
  width: 100%;
  min-width: 540px;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
}
.archive-center-file-table th {
  height: 36px;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-soft, #f7f9fb);
  color: var(--muted);
  text-align: left;
  font-weight: 600;
}
.archive-center-file-table td {
  height: 50px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.archive-center-file-table tr:last-child td { border-bottom: 0; }
.archive-center-file-direction {
  color: var(--text, #344054);
  font-weight: 600;
}
.archive-center-file-name {
  overflow: hidden;

/* =================== Big-account-selection split =================== */
.big-account-selection-toolbar {
  display: flex; align-items: center; gap: 10px;
  margin-left: auto;
}
.big-account-mode-label {
  font-size: 12px; color: var(--muted);
}
.big-account-mode-select {
  height: 36px;
  width: 180px;
  padding: 0 36px 0 14px;
  border-radius: var(--pill);
  font-size: 13px;
}
.big-account-split-body {
  flex: 1; padding: 8px 12px 0;
  overflow: hidden;
  /* v2.1.7 round 5 B4 防御性兜底（spec §11.3.3 第 1 层）：modal-card 的 flex column 子项
     主路径 1080p viewport 下 split-body flex:1 可用 ~944px >> ba-scroll-container max-height 52vh = 562px → 不触发
     极小屏（< 700px 高）边界 case 下可能 content size 撑超 modal-card max-height: calc(100vh - 56px)
     防御性加 min-height: 0 兜底（不影响主路径，与第 3 层 file-list min-height: 0 联合形成完整高度链） */
  min-height: 0;
}
.ba-scroll-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  /* v2.1.7 round 6 B4 真根因 fix（DevTools 数据揭示）：grid-template-rows 缺失 → 默认 grid-auto-rows: auto = content size
     → grid item (split-left) 撑到 content 高度（实测 5952px）远超父 max-height: 52vh (实测 447px)
     → file-list 自身父级无限制 → overflow-y:auto 永不触发
     round 4/5 加的 split-left/right + file-list + split-body min-height: 0 全部 computed = "0px" 但不解决问题
     真 fix = grid-template-rows: 1fr 让 row 等于父高度，grid item 跟随 row 限到 447px
     spec §11.3 反向同步待 T14 PM 处理 */
  grid-template-rows: 1fr;
  gap: 16px;
  height: 100%;
  min-height: 360px;
  max-height: 52vh;
}
.big-account-split-left,
.big-account-split-right {
  display: flex; flex-direction: column;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--panel, #fff);
  /* v2.1.7 round 4 B4（spec §10.3.2 真根因 fix）：让 grid 子项允许收缩到 < content size
     不加这行 → grid item min-height: auto = content size 穿透父 .ba-scroll-container max-height: 52vh
     → file-list overflow-y:auto 永不触发 → 20+ 文件无滚动条
     与 dev round 3 加的 scrollbar-width: thin / ::-webkit-scrollbar 形成"滚动条出现 + 可见"两阶段完整覆盖 */
  min-height: 0;
}
.big-account-split-header {
  padding: 12px 16px;
  font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted);
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line-soft);
}
.big-account-file-list,
.big-account-order-list {
  flex: 1;
  overflow-y: auto;
  /* v2.1.7 round 5 B4 真根因第 2 层主修（spec §11.3.3 第 3 层）：用户报告主路径
     与 round 4 给 .big-account-split-left/right 的 min-height: 0 配套（经典 flex 嵌套坑）
     默认 min-height: auto = content size → 即使父 split-left 加了 min-height: 0，file-list 自己仍把父撑到 content size 高
     → 祖父 ba-scroll-container max-height: 52vh 仍被穿透 → 自己 overflow-y: auto 永不触发
     每层 flex item 都需要显式 min-height: 0，content size 才不会从最内层一路撑过所有父级约束 */
  min-height: 0;
  padding: 6px 8px;
  display: flex; flex-direction: column; gap: 4px;
  /* v2.1.7 round 3 B4（spec §9.5.4 推荐方向）：强制滚动条可见（防 macOS overlay-style 仅 hover 时显示导致用户误判"滚动条不可用"）
     scrollbar-width: thin 是标准属性（Firefox + 现代 Webkit）；::-webkit-scrollbar 是 macOS Electron 兜底 */
  scrollbar-width: thin;
  scrollbar-color: rgba(100, 80, 60, 0.3) transparent;
}
.big-account-file-list::-webkit-scrollbar,
.big-account-order-list::-webkit-scrollbar {
  width: 8px;
}
.big-account-file-list::-webkit-scrollbar-thumb,
.big-account-order-list::-webkit-scrollbar-thumb {
  background: rgba(100, 80, 60, 0.3);
  border-radius: 4px;
}
.big-account-file-list::-webkit-scrollbar-thumb:hover,
.big-account-order-list::-webkit-scrollbar-thumb:hover {
  background: rgba(100, 80, 60, 0.5);
}
/* v2.1.7 round 2 R6a 方案 C：grid 2 列硬编码 → 3 列适配 multi 模式各分支 3 子项渲染（spec §8.7.3）
   - multi 编辑态：    [checkbox + letter + 文件名] 3 子项
   - multi grouped 闭合态：[✓ + a. + 文件名 → MERCHANT USD] 3 子项
   - multi uncovered 态：[空 letter + idx + 文件名] 3 子项
   - 非 multi 普通态：  [idx + 文件名] 2 子项（col-3 留白，meta 靠左 ellipsis 正常）
   - PM 建议：preview 验证后若非 multi 视觉破版，可加 `:not(.ba-multi-editing):not(.ba-multi-grouped)` 限定 grid-column 兜底 */
.ba-file-row {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: transparent;
  cursor: default;
  font-size: 13px;
}
.ba-file-row:hover { background: var(--bg-soft); }
.ba-file-idx {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--chip-bg);
  color: var(--muted);
  font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.ba-file-name {
  /* v2.1.7 round 2 R6a 方案 C：grid 子项不接受 flex（round 1 b1ba84b 误加 flex:1 1 auto 对 grid 子项无效）
     靠 min-width:0 + ellipsis + 父 grid 1fr 列即可实现自适应收缩 + 末尾截断（spec §8.7.3） */
  min-width: 0;
  font-family: "Roboto Mono", ui-monospace, monospace;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ba-order-row {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
}
.ba-order-row:hover { background: var(--bg-soft); }
.ba-order-row.is-selected {
  background: var(--chip-active-bg);
  border-color: var(--primary-soft);
}
.ba-order-badge {
  font-size: 13px; font-weight: 600;
  color: var(--primary);
  min-width: 20px;
}
.ba-order-content { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ba-order-title {
  font-size: 13px; font-weight: 500;
  color: var(--text);
  font-family: "Roboto Mono", ui-monospace, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ba-order-sub {
  font-size: 11px; color: var(--muted);
}
.big-account-selection-footer {
  flex-wrap: wrap; gap: 12px;
}
.big-account-selection-footer-divider {
  height: 20px; width: 1px;
  background: var(--line-soft);
  margin: 0 4px;
}
.big-account-search-label {
  font-size: 12px; color: var(--muted);
  margin-left: auto;
}
.big-account-search-input {
  width: 200px; height: 36px;

.ba-multi-mode-label,
.big-account-remember-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
  white-space: nowrap;

/* =================== Palette float =================== */
.muted-preview {
  min-height: 140px;
  background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.3));
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
}
.muted-preview.tall { min-height: 220px; }
.palette-float {
  position: fixed;
  left: 24px; bottom: 24px;
  width: 210px;
  background: var(--panel, #fff);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,.18);
  padding: 10px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 60;
}
.palette-body {
  position: relative;
  height: 170px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--panel, #fff);
}
.palette-spectrum {
  position: absolute; inset: 0;
  background:
    linear-gradient(to right,
      hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%),
      hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%),
      hsl(280,100%,50%), hsl(320,100%,50%), hsl(360,100%,50%));
}
.palette-sat {
  position: absolute; inset: 0;
  background: linear-gradient(to right, #fff, transparent);
}
.palette-light {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent, #000);
}
.palette-cursor {
  position: absolute;
  width: 14px; height: 14px;
  border: 2px solid var(--line, #fff);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  transform: translate(-50%, -50%);
}
.palette-swatch-preview {
  position: absolute;
  right: 10px; top: 10px;
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--line, #fff);
  box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,.18);
  background: var(--panel, #ffffff);
}
.palette-swatch-preview.is-alt { background: #b48af0; }
.palette-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
}
.palette-footer-right { display: flex; gap: 6px; }
.palette-footer .tiny {
  height: 28px;
  padding: 0 12px;
  font-size: 12px;
  border-radius: 999px;
}

/* v2.1.0-beta.2 PR-A Round 2（task R2-12）：账单类型 bt-header + condition-row 用同一 6 列 grid
   让 #N 占 col 1、side/field 占 col 2（同列同宽）、op 占 col 3、value 占 col 4、× 占 col 5、新增 占 col 6
   所有下拉框（side / field / op / value 实际是 input，但视觉等同）的左右边界垂直对齐 */
.scenario-config-c4-bt-header {

.scenario-config-c4-bt-header > [data-c4-bt-field="side"] { grid-column: 2; }

  display: flex;
  flex-direction: column;
  gap: 6px;
  /* v2.1.0-beta.2 PR-A Round 2：去掉 padding-left（grid col 1 已占 36px 顶替了原 #N 的空间） */
}

  grid-template-columns: 36px minmax(0, 1fr) 100px minmax(0, 1fr) 22px 60px;
  gap: 8px;
  align-items: center;
}

.scenario-config-c4-condition-row > [data-c4-cond-field="field"] { grid-column: 2; }
.scenario-config-c4-condition-row > [data-c4-cond-field="op"] { grid-column: 3; }
.scenario-config-c4-condition-row > [data-c4-cond-field="value"] { grid-column: 4; }
.scenario-config-c4-condition-row > [data-c4-cond-action="remove"] { grid-column: 5; }

/* v2.1.0-beta.2 PR-A Round 2（task R2-12）：对账字段 group-header + fieldpair 用同一 6 列 grid
   col 1 = 90px (group-header "分组 N 左：" 文本 / fieldpair 空 spacer)
   col 2 = 1fr  (leftTypeSeq / leftField — 上下对齐)
   col 3 = 60px (group-header "vs 右：" / fieldpair "=")
   col 4 = 1fr  (rightTypeSeq / rightField — 上下对齐)
   col 5 = 22px (×)
   col 6 = 60px (group-header 空 / fieldpair "新增") */
.scenario-config-c4-recon-group-header {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr) 60px minmax(0, 1fr) 22px 60px;
  gap: 8px;

.scenario-config-c4-recon-fieldpairs {

  flex-direction: column;
  gap: 6px;
}

.scenario-config-c4-recon-fieldpair {

  grid-template-columns: 90px minmax(0, 1fr) 60px minmax(0, 1fr) 22px 60px;
  gap: 8px;

/* v2.1.0-beta.2 PR-A Round 2（task R2-12）：分隔符 / 标签文字防换行（vs 右： / 新增 等小列） */

/* v2.1.0-beta.2 PR-A Round 2（task R2-13）：locked 行视觉提示改用 box-shadow inset，避免 padding/border 影响 grid 列对齐

   2026-05-27 fix1-N5-UI-4：footer 由 space-between 改为左组 + 右组紧贴

   - 容器只负责 flex + 间距；label 用 .select-label，select 用 .template-select
   v2.1.3-fix2.1：左右边界对齐 row2 "导出差异" 按钮（.pending-board .cell.left .secondary-btn min-width:180px）

/* v2.1.4 T3：小助手功能收纳弹窗（Clear theme，index.html 实际加载的样式） */

  flex-direction: column;

  gap: 14px;
  /* Fix1.1：左右各 28px 内缩，与 dialog-header padding-left/right=28px 对齐（"小助手功能收纳"标题最左 = section 最左） */

.module-cabinet-item {

  align-items: center;
  justify-content: space-between;

.module-cabinet-item-label {

  color: var(--dim, #94a0b8);

.module-cabinet-drag-handle:active {

}
.module-cabinet-controls {

  flex-direction: column;

/* === v3.0.8 需求1：工具箱🧰（合表 / 拆表）主弹框 + 拆表选字段弹框（Clear 风格副本，复用 dialog 基础样式）=== */
.toolbox-card {
  /* v3.1.13：为左侧 144px 状态框留出空间。 */
  width: min(94vw, 414px);
  /* v3.0.8 微调（口径 B）：卡片高 +15 由 .toolbox-body padding-bottom 承担，
     overlay 垂直居中会把上沿上移 7.5；这里整体下移 7.5 抵消，
     使上沿回到最原始基线、下沿净往下 +15。 */
  transform: translateY(7.5px);
}
.toolbox-body {
  --toolbox-label-width: 72px;
  display: grid;
  grid-template-columns:
    calc(var(--toolbox-label-width) + var(--toolbox-label-width))
    minmax(0, 1fr);
  grid-template-rows: 36px 36px;
  column-gap: 22px;
  row-gap: 18px;
  /* v3.0.8 微调：下沿往下 +15（padding-bottom 12 → 27） */
  padding: 24px 28px 27px;

/* ============================================================
 * v2.1.13 字体策略（仅 Windows + 默认 Clear 主题；mac / General 主题不受影响）
 *   除大标题外，所有模块所有页面文本：英文/数字 → Courier New，中文 → Noto Sans SC
 *   机制：字符级 fallback（Courier 含拉丁/数字字形；中文 Courier 无字形 → 自动 fallback 到 Noto Sans SC）
 *   平台：仅 win32（body[data-platform="win32"]，renderer 启动注入）；非 Win 保持原字体
 *   大标题：page-title/dialog-title（含子元素 .gemini-gradient）恢复原 Google Sans 比例字体
 *   等宽口径：原 Roboto Mono 标识符(文件名/订单号/币种/字段名/序号/标签等)一并归入 Courier（均等宽，对齐不变）
 *   字体定义见 src/fonts.css（本地打包 Noto Sans SC 子集）
 * ============================================================ */

/* 1) 全局：win32 下所有元素 英文数字→Courier、中文→Noto（* 覆盖一切显式 font-family，含 13 处原 Roboto Mono 标识符 + select/option）*/
body[data-platform="win32"],
body[data-platform="win32"] * {
  font-family: "Courier New", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
}

/* 2) 补足唯一高特异性(0,2,0)等宽标识符 .extract-order-row .eo-idx（> 上面 body * 的 (0,1,0)）*/
body[data-platform="win32"] .extract-order-row .eo-idx {
  font-family: "Courier New", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
}

/* 3) 大标题恢复原比例字体（page-title/dialog-title 及其子元素；特异性 (0,2,0) > body * 的 (0,1,0)）*/
body[data-platform="win32"] .page-title,
body[data-platform="win32"] .page-title *,
body[data-platform="win32"] .dialog-title,
body[data-platform="win32"] .dialog-title * {
  font-family: "Google Sans", "Google Sans Display", "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* v3.0.3 PR-E：资金对账数据处理状态框「渠道名:场景序号」多行明细可滚动。

 *   加 max-height + overflow-y 让超高时滚动，不撑破布局。
 *   坑：.status-box 基础类（styles-gemini.css:285）为 flex + align-items:center，
 *     滚动容器内 center 对齐会把顶部内容顶到可视区外滚不到 → 这里覆盖 align-items: flex-start；
 *     再给统一内容层加垂直 margin:auto，使单行/短文案在 min-height:110px 下仍垂直居中观感，

  <script>const DEFAULT_BACKGROUND_SETTINGS = { colorHex: '#ffffff' };
function normalizeColorHex(colorHex) {
  const normalized = String(colorHex || '').trim().toLowerCase();
  return /^#[0-9a-f]{6}$/.test(normalized) ? normalized : DEFAULT_BACKGROUND_SETTINGS.colorHex;
}
function cloneBackgroundSettings(backgroundSettings = DEFAULT_BACKGROUND_SETTINGS) {
  return {
    colorHex: normalizeColorHex(backgroundSettings.colorHex),
    imageDataUrl: String(backgroundSettings.imageDataUrl || ''),
    filePath: String(backgroundSettings.filePath || ''),
    sourceFileName: String(backgroundSettings.sourceFileName || ''),
    sourcePath: String(backgroundSettings.sourcePath || '')
  };
}
function clampColorChannel(value) {
  return Math.max(0, Math.min(255, Math.round(value)));
}
function mixRgb(fromRgb, toRgb, ratio) {
  const safeRatio = Math.max(0, Math.min(1, ratio));
  return {
    r: clampColorChannel(fromRgb.r + (toRgb.r - fromRgb.r) * safeRatio),
    g: clampColorChannel(fromRgb.g + (toRgb.g - fromRgb.g) * safeRatio),
    b: clampColorChannel(fromRgb.b + (toRgb.b - fromRgb.b) * safeRatio)
  };
}
function hexToRgb(colorHex) {
  const normalized = normalizeColorHex(colorHex);
  return {
    r: parseInt(normalized.slice(1, 3), 16),
    g: parseInt(normalized.slice(3, 5), 16),
    b: parseInt(normalized.slice(5, 7), 16)
  };
}
function mixColor(fromHex, toHex, ratio) {
  const from = hexToRgb(fromHex);
  const to = hexToRgb(toHex);
  return mixRgb(from, to, ratio);
}
function rgbToCss(rgb, alpha) {

}

    return {

function buildLightBackgroundStyle(backgroundSettings) {

        `linear-gradient(180deg, ${rgbToCss(baseColor, 0.18)} 0%, ${rgbToCss(baseColor, 0.3)} 100%)`,
        `url("${normalized.imageDataUrl}")`

      backgroundSize: 'auto, auto, auto, cover',

  return {
    backgroundColor: rgbToCss(mixColor(normalized.colorHex, '#ffffff', 0.66)),
    backgroundImage: [
      'radial-gradient(circle at top left, rgba(255, 255, 255, 0.75), transparent 30%)',

    const valid = DarkModeSchedule.validateDarkModeSchedule(config);
    try { localStorage.setItem(previewStorageKey, JSON.stringify(valid)); }
    catch (_error) { return { status: 'failed', message: '浏览器不允许保存设置，请启用本地存储后重试' }; }
    schedule = valid;
    return { status: 'ok', ...makeSnapshot() };
  }
};
function paintBackground() {
  const style = buildBackgroundStyle(DEFAULT_BACKGROUND_SETTINGS);
  Object.assign(document.getElementById('appShell').style, style);
  document.body.style.backgroundColor = document.documentElement.dataset.theme === 'dark' ? '#111419' : '#f9fafc';
}
themeController = DarkModeUI.createController({ api: previewApi, document, onChange: paintBackground });
themeController.accept(makeSnapshot());
function closePreviewModal() {
  if (themeController.getSnapshot().saving) return;
  settingsView?.destroy();
  settingsView = null;
  rootNode.replaceChildren();
  previousFocus?.focus();
}
function openModalShell(title, content, className = '') {
  closePreviewModal();
  previousFocus = document.activeElement;
  rootNode.innerHTML = `<div class="modal-overlay"><section class="modal-card ${className}" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-header"><div class="dialog-title">${title}</div><button class="icon-close" data-preview-close aria-label="关闭">×</button></div>${content}<div class="dialog-actions"><button class="primary-btn small" data-preview-close>完成</button></div></section></div>`;
  rootNode.querySelectorAll('[data-preview-close]').forEach((button) => button.addEventListener('click', closePreviewModal));
  rootNode.querySelector('[data-preview-close]').focus();
}
function openPreviewSettings() {
  openModalShell('设置', '<div class="app-settings-layout"><nav class="app-settings-nav" aria-label="设置导航"><button class="app-settings-nav-item is-active" aria-current="page">☾　外观设置</button></nav><div class="app-settings-main"><section id="previewAppearancePane" class="app-settings-pane appearance-pane" aria-label="外观设置"></section></div></div>', 'preview-settings-card');
  settingsView = DarkModeUI.mountSettings(document.getElementById('previewAppearancePane'), themeController);
}
function openPreviewTable() {
  openModalShell('账户映射 · 示例', '<div class="preview-table-scroll"><table class="data-table"><thead><tr><th>商户</th><th>币种</th><th>大账号</th><th>状态</th></tr></thead><tbody><tr><td>示例商户 A</td><td>USD</td><td><input class="mapping-text-input" aria-label="示例账号" value="DEMO-001" /></td><td style="color:var(--success)">已匹配</td></tr><tr><td>示例商户 B</td><td>HKD</td><td><select class="mapping-select" aria-label="示例账户选择"><option>DEMO-002</option><option>DEMO-003</option></select></td><td style="color:var(--warning)">待确认</td></tr><tr class="migration-empty-row"><td>示例商户 C</td><td>EUR</td><td><input class="mapping-text-input" aria-label="禁用示例账号" value="尚未配置" disabled /></td><td style="color:var(--danger)">缺少映射</td></tr></tbody></table></div>', 'preview-table-dialog');
}
document.getElementById('settingsBtn').addEventListener('click', openPreviewSettings);
document.getElementById('accountMappingBtn').addEventListener('click', openPreviewTable);
const modules = [['statementModulePanel', '网银账单生成'], ['bankStatementModulePanel', '资金对账数据处理'], ['positionReconciliationModulePanel', '平盘对账数据处理']];
const moduleMenu = document.getElementById('moduleSwitcherMenu');
const moduleTrigger = document.getElementById('moduleSwitcherBtn');
moduleMenu.innerHTML = modules.map(([id, name]) => `<button class="module-option" data-panel="${id}">${name}</button>`).join('');
moduleTrigger.addEventListener('click', () => { moduleMenu.hidden = !moduleMenu.hidden; moduleTrigger.setAttribute('aria-expanded', String(!moduleMenu.hidden)); });
moduleMenu.addEventListener('click', (event) => {
  const choice = event.target.closest('[data-panel]');
  if (!choice) return;
  document.querySelectorAll('.module-panel,.new-account-panel').forEach((panel) => { panel.hidden = panel.id !== choice.dataset.panel; });
  document.getElementById('currentModuleName').textContent = choice.textContent;
  moduleMenu.hidden = true;
  moduleTrigger.setAttribute('aria-expanded', 'false');
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closePreviewModal();
  if (event.key !== 'Tab' || !rootNode.firstElementChild) return;
  const focusable = [...rootNode.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')];
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});
document.getElementById('appVersion').textContent = '3.2.9 · 外观预览';
let clockTimer;
function refreshClock() {
  themeController.accept(makeSnapshot());
  const now = new Date();
  clockTimer = setTimeout(refreshClock, 60000 - now.getSeconds() * 1000 - now.getMilliseconds());
}
refreshClock();
window.addEventListener('focus', () => { clearTimeout(clockTimer); refreshClock(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(clockTimer); refreshClock(); } });
window.addEventListener('unload', () => { clearTimeout(clockTimer); themeController.dispose(); });
</script></body>
