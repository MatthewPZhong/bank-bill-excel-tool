  保留：居中标题、顶部模块切换、主面板槽位、胶囊按钮、底部工具入口。
  新增原型：主题入口、外观设置、深浅语义色及示例弹窗。不是生产代码补丁。
  所有业务数据均为合成示例。文件选择仅取文件名，不读取、不上传、不写入、不删除文件。

-->
<script>
(function () {
  var p = 'dark';
  try { var s = localStorage.getItem('bbet-v329-preview-theme'); if (['light','dark','system'].indexOf(s) >= 0) p = s; } catch (_) {}

  document.documentElement.style.colorScheme = t;
  window.__themePreference = p;
})();
</script>

<script>
'use strict';
const $ = (s,root=document) => root.querySelector(s);
const $$ = (s,root=document) => Array.from(root.querySelectorAll(s));
const icon = (name, cls='') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules = {fund:'资金对账数据处理',statement:'网银账单生成',position:'平盘对账数据处理'};
const media = window.matchMedia('(prefers-color-scheme: dark)');
let preference = window.__themePreference || 'dark';
let lightBackground = 'default';
const backgrounds = {default:{name:'默认',value:'#f9fafc'},mist:{name:'雾蓝',value:'#edf3fc'},sage:{name:'浅绿',value:'#eff6f2'},sand:{name:'暖白',value:'#f9f5ef'},lilac:{name:'浅紫',value:'#f3f0fa'}};
try { const saved = localStorage.getItem('bbet-v329-preview-background'); if (Object.hasOwn(backgrounds,saved)) lightBackground = saved; } catch (_) {}
let activeModule = 'fund', activeDialog = '', runTimer = null, progress = 0, toastTimer;
let model = {fund:{state:'imported',files:['银行对账单_202609_示例.xlsx','网关账单_202609_示例.xlsx','业务单据_202609_示例.xlsx']},statement:{state:'idle',files:[]},position:{state:'idle',files:[]}};
let pendingFiles = [];
let businessSelectors={statement:'制作网银账单',position:'平盘资金性质校验'};
const appDialog=$('#appDialog'),confirmDialog=$('#confirmDialog');
const archives = [
 {id:'DEMO-20260912-003',module:'资金对账数据处理',time:'2026-09-12 10:42',count:3,status:'已完成',kind:'success'},
 {id:'DEMO-20260912-002',module:'网银账单生成',time:'2026-09-12 10:16',count:2,status:'已完成',kind:'success'},
 {id:'DEMO-20260912-001',module:'平盘对账数据处理',time:'2026-09-12 09:58',count:4,status:'有差异',kind:'warning'},
 {id:'DEMO-20260911-005',module:'资金对账数据处理',time:'2026-09-11 17:24',count:1,status:'失败',kind:'danger'},
 {id:'DEMO-20260911-004',module:'网银账单生成',time:'2026-09-11 16:50',count:2,status:'已完成',kind:'success'}

const linkedFiles=[
 {name:'银行账户映射_示例.xlsx',type:'账户映射',count:'128',time:'2026-09-12 09:30',status:'可用',kind:'success'},
 {name:'网关账单_示例.xlsx',type:'网关账单',count:'2,640',time:'2026-09-12 09:32',status:'可用',kind:'success'},

 {name:'账户配置_示例.xlsx',type:'账户映射',count:'24',time:'2026-09-11 16:05',status:'格式异常',kind:'danger'}
];
function persist(key,value){try{localStorage.setItem(key,value);return true;}catch(_){return false;}}
function resolvedTheme(){return preference==='system'?(media.matches?'dark':'light'):preference;}
function updateTheme(notify=false){
 const resolved=resolvedTheme(), names={light:'浅色外观',dark:'深色外观',system:'跟随系统'}, icons={light:'sun',dark:'moon',system:'monitor'};
 document.documentElement.dataset.theme=resolved;document.documentElement.style.colorScheme=resolved;
 document.documentElement.style.setProperty('--bg',resolved==='light'?backgrounds[lightBackground].value:'#111419');
 $('#themeTriggerLabel').textContent=names[preference];$('#themeTriggerIcon').setAttribute('href','#i-'+icons[preference]);
 $('#modeBadgeIcon').setAttribute('href','#i-'+(resolved==='dark'?'moon':'sun'));
 $('#modeBadgeText').textContent=(preference==='system'?'跟随系统 · ':'')+(resolved==='dark'?'夜间模式':'浅色模式');
 $$('[data-theme-set]').forEach(b=>{const selected=b.dataset.themeSet===preference;b.classList.toggle('selected',selected);b.setAttribute('aria-checked',String(selected));});
 $$('input[name="appearance"]').forEach(r=>r.checked=r.value===preference);
 if($('#systemStatus'))$('#systemStatus').textContent='系统当前为'+(media.matches?'深色':'浅色');
 if($('#appearanceCurrent'))$('#appearanceCurrent').textContent=resolved==='dark'?'深色背景已启用':'使用浅色背景偏好';
 if($('#appearanceBackgroundNote'))$('#appearanceBackgroundNote').textContent=resolved==='dark'?'深色模式暂时覆盖浅色自定义背景，切回浅色后恢复。':'可在背景调色盘中设置浅色背景，独立保存，不影响深色模式。';
 if($('#paletteModeNote')){const dark=resolved==='dark';$('#paletteModeNote').innerHTML=icon('info')+`<p>${dark?'深色模式使用统一深色背景。已保存的浅色背景不会被重置，切回浅色后恢复。':'以下颜色仅作用于浅色模式。选择后立即生效，夜间模式仍使用统一深色背景。'}</p>`;$$('[data-bg]').forEach(b=>{b.disabled=dark;b.classList.toggle('selected',b.dataset.bg===lightBackground);});}
 if(notify)toast('已切换为'+names[preference]+(preference==='system'?'，随系统外观自动变化':''));
}
function setTheme(value,notify=true){if(!['light','dark','system'].includes(value))return;preference=value;const saved=persist('bbet-v329-preview-theme',value);updateTheme(notify);if(!saved)toast('外观已切换；当前浏览器不允许保存偏好，关闭页面后可能恢复默认。');}
if(media.addEventListener)media.addEventListener('change',()=>updateTheme(false));else media.addListener(()=>updateTheme(false));
function toast(message){const t=$('#toast');clearTimeout(toastTimer);t.innerHTML=icon('circle-check')+`<span>${esc(message)}</span>`;try{if(t.showPopover&&!t.matches(':popover-open'))t.showPopover();}catch(_){} requestAnimationFrame(()=>t.classList.add('show'));toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>{try{if(t.hidePopover&&t.matches(':popover-open'))t.hidePopover();}catch(_){}},170);},2900);}
function closeMenus(){['themeMenu','moduleMenu','toolboxMenu'].forEach(id=>$('#'+id).hidden=true);['themeTrigger','moduleSwitcherBtn','toolboxTrigger'].forEach(id=>$('#'+id).setAttribute('aria-expanded','false'));}
function toggleMenu(id,trigger){const wasHidden=$('#'+id).hidden;closeMenus();if(wasHidden){$('#'+id).hidden=false;trigger.setAttribute('aria-expanded','true');}}
function button(text,action,style='secondary',disabled=false,ic=''){return `<button class="${style}-btn" data-action="${action}" ${disabled?'disabled':''}>${ic?icon(ic):''}${text}</button>`;}
function statusMarkup(){
 const m=model[activeModule],s=m.state,n=m.files.length||3;
 let content='欢迎使用小助手';
 if(s==='imported')content=`<div class="status-title"><strong>已导入 ${n} 个文件，等待运行</strong></div><p>示例文件已就绪</p>`;
 if(s==='running')content=`<div class="status-title">${icon('loader','sm spin')}<strong>正在处理示例数据…</strong></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="width:${progress}%"></span></div><p class="progress-label">${progress}% · 运行状态模拟</p>`;
 if(s==='done')content=`<div class="status-title">${icon('circle-check','sm')}<strong>处理完成</strong></div><p>示例结果已就绪，可预览导出状态</p>`;
 if(s==='error')content=`<div class="status-title">${icon('alert','sm')}<strong>处理未完成</strong></div><p>示例：文件缺少必填字段，请检查后重试。</p>`;
 return `<div class="status-box state-${s}" role="status" aria-live="polite"><div class="status-content">${content}</div></div>`;
}
function renderBoard(){
 const s=model[activeModule].state,busy=s==='running',canRun=['imported','done','error'].includes(s),canExport=s==='done';
 let html='';
 if(activeModule==='fund')html=`<div class="fund-grid"><div class="fund-actions">${button('导入文件','import','primary',busy,'upload')}${button('导出文件','export','secondary',!canExport)}</div>${button('开始运行','run','primary',!canRun,'play')}<div class="fund-status">${statusMarkup()}</div><div class="fund-scenario">${button('场景管理','scenarios')}</div><div class="fund-linked">${button('链接表管理','linked')}</div></div>`;
 if(activeModule==='statement')html=`<div class="statement-grid">${button('导入文件','import','primary',busy)}<div class="inline-field"><label for="statementMode">模式</label><select id="statementMode" class="pill-select" ${busy?'disabled':''}><option>制作网银账单</option><option>导出月度余额账单</option></select></div><div class="pair">${button('导出明细','export','primary',!canExport)}${button('导出余额','export','secondary',!canExport)}</div>${button('导入模板','import-template','secondary',busy)}<div class="pair">${button('模板管理','templates')}${button('账户映射','mapping')}</div>${statusMarkup()}</div>`;
 if(activeModule==='position')html=`<div class="position-grid"><div class="position-select"><label for="positionFunction">功能</label><select id="positionFunction" class="pill-select" ${busy?'disabled':''}><option>平盘资金性质校验</option><option>平盘对账数据处理</option><option>平盘订单销账处理</option></select>${button('开始运行','run','primary',busy)}</div><div class="pair">${button('对账数据管理','linked')}${button('链接表管理','linked')}</div><div class="pair position-config">${button('对账配置管理','scenarios')}${button('结果确认','result')}</div>${statusMarkup()}</div>`;
 $('#moduleBoard').innerHTML=html;$('#moduleBoard').setAttribute('aria-label',modules[activeModule]+'操作面板');
 if(activeModule==='fund'){$$('.fund-grid>.fund-scenario>.secondary-btn,.fund-grid>.fund-linked>.secondary-btn').forEach(b=>b.style.width='100%');$('.fund-status>.status-box').style.height='100%';}
 if($('#statementMode'))$('#statementMode').value=businessSelectors.statement;if($('#positionFunction'))$('#positionFunction').value=businessSelectors.position;
 $$('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===s)));
}
function stopRun(){if(runTimer){clearInterval(runTimer);runTimer=null;}}
function setState(state){if(!['idle','imported','running','done','error'].includes(state))return;stopRun();if(state==='running')progress=64;model[activeModule].state=state;renderBoard();}
function selectModule(key){if(!Object.hasOwn(modules,key))return;stopRun();if(model[activeModule].state==='running')model[activeModule].state='imported';activeModule=key;$('#currentModuleName').textContent=modules[key];$$('[data-module]').forEach(b=>{b.classList.toggle('selected',b.dataset.module===key);if(b.hasAttribute('aria-checked'))b.setAttribute('aria-checked',String(b.dataset.module===key));});closeMenus();renderBoard();if(appDialog.open)appDialog.close();}
function runDemo(){stopRun();progress=0;model[activeModule].state='running';renderBoard();runTimer=setInterval(()=>{progress=Math.min(100,progress+8);const bar=$('[role="progressbar"]');if(bar){bar.setAttribute('aria-valuenow',String(progress));$('span',bar).style.width=progress+'%';}if($('.progress-label'))$('.progress-label').textContent=progress+'% · 运行状态模拟';if(progress>=100){stopRun();model[activeModule].state='done';renderBoard();toast('演示运行完成。未执行真实对账。');}},160);}
function dialogHeader(title,ic='settings',eyebrow=''){return `<header class="dialog-header"><div class="dialog-title-group"><span class="dialog-title-icon">${icon(ic)}</span><div>${eyebrow?`<div class="dialog-eyebrow">${eyebrow}</div>`:''}<h2 id="dialogTitle">${title}</h2></div></div><button class="icon-btn" data-close="app" aria-label="关闭弹窗">${icon('close')}</button></header>`;}
function footer(left='',right='完成',action='close'){return `<footer class="dialog-footer"><div class="footer-tip">${left}</div><div class="dialog-footer-right"><button class="primary-btn" ${action==='close'?'data-close="app"':`data-action="${action}"`}>${right}</button></div></footer>`;}
function showDialog(name,title,body,opts={}){closeMenus();activeDialog=name;appDialog.className=opts.size||'';appDialog.innerHTML=dialogHeader(title,opts.icon||'settings',opts.eyebrow||'')+`<div class="dialog-body">${body}</div>`+(opts.footer||footer(icon('shield')+'仅外观预览 · 不操作真实业务数据'));if(!appDialog.open)appDialog.showModal();$('.dialog-body',appDialog).scrollTop=0;updateTheme(false);}
function miniWindow(dark=false){return `<div class="mini-window ${dark?'dark-mini':''}"><div class="mini-top"><i></i><i></i><i></i></div><div class="mini-heading"></div><div class="mini-panel"><i></i><i></i></div></div>`;}
function appearanceDialog(){const choices=[['light','浅色','sun'],['dark','深色','moon'],['system','跟随系统','monitor']];showDialog('appearance','外观',`
 <h3 class="section-label">外观模式</h3><p class="section-description">选择适合当前环境的外观。主界面、弹窗和数据表格将同步切换。</p>
 <fieldset class="theme-options"><legend class="sr-only">选择外观模式</legend>${choices.map(([id,title,ic])=>`<label class="theme-choice"><input type="radio" name="appearance" value="${id}" ${preference===id?'checked':''}>${id==='system'?`<div class="system-mini">${miniWindow(false)}${miniWindow(true)}</div>`:miniWindow(id==='dark')}<span class="theme-caption"><span class="theme-caption-left">${icon(ic,'sm')}${title}</span><span class="radio-visual" aria-hidden="true"></span></span></label>`).join('')}</fieldset>
 <div class="theme-behavior note-box">${icon('info')}<p>跟随系统：随操作系统的浅色／深色设置自动切换。<br><span id="systemStatus">系统当前为浅色</span>；本原型首次打开默认使用深色。</p></div>
 <hr class="setting-separator"><div class="setting-row"><div><strong>工作区背景</strong><p id="appearanceBackgroundNote"></p></div><div class="color-stack" aria-hidden="true"><i></i><i></i><i></i></div></div>
 <div class="setting-row" style="margin-top:14px"><span class="subtle-badge">${icon('palette','sm')}<span id="appearanceCurrent"></span></span><button class="text-btn" data-open="palette">背景调色盘${icon('arrow','sm')}</button></div>
 <p class="theme-footer-note">外观偏好仅保存在此原型的浏览器存储中，不修改正式应用设置。主题只改变界面，不改变对账规则或导出内容。</p>`,{icon:'moon',eyebrow:'设置 / APPEARANCE',footer:`<footer class="dialog-footer"><button class="text-btn" data-action="theme-reset">恢复为跟随系统</button><div class="dialog-footer-right"><span class="footer-tip">选择即生效</span><button class="primary-btn" data-close="app">完成</button></div></footer>`});}
function paletteDialog(){showDialog('palette','背景调色盘',`<div class="note-box" id="paletteModeNote"></div><div class="palette-swatches">${Object.entries(backgrounds).map(([id,b])=>`<button class="swatch-btn ${id===lightBackground?'selected':''}" data-bg="${id}" ${resolvedTheme()==='dark'?'disabled':''} aria-label="浅色背景：${b.name}"><span style="background:${b.value}"></span>${b.name}</button>`).join('')}</div><div class="setting-row"><span class="footer-tip">浅色背景偏好：<span id="savedBgName">${backgrounds[lightBackground].name}</span></span><button class="text-btn" data-theme-light>切换为浅色${icon('sun','sm')}</button></div><p class="theme-footer-note">原型仅展示纯色背景；正式版的背景文件导入功能不在本次原型内模拟。</p>`,{size:'compact',icon:'palette',footer:footer('<button class="text-btn" data-open="appearance">返回外观设置</button>')});}
function importDialog(isTemplate=false){pendingFiles=[];showDialog('import',isTemplate?'导入模板':'导入文件',`<div class="upload-zone" id="uploadZone"><div class="upload-icon">${icon('upload','lg')}</div><p>拖放文件到这里，或选择本地文件</p><small>支持 .xlsx、.xls、.csv · 只显示文件名，不读取或上传内容</small><button class="secondary-btn small-btn" data-action="pick-files">选择文件</button></div><div class="file-list" id="pendingFiles"></div><div class="note-box" style="margin-top:17px">${icon('info')}<p>没有准备文件？使用内置示例即可检查导入后的按钮和状态效果。</p></div>`,{size:'compact',icon:'upload',footer:`<footer class="dialog-footer"><button class="text-btn" data-action="sample-files">使用示例文件</button><button class="primary-btn" id="confirmImport" data-action="confirm-import" disabled>确认导入</button></footer>`});const zone=$('#uploadZone');zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');acceptFiles(Array.from(e.dataTransfer.files).map(f=>f.name));});}
function acceptFiles(names){const valid=names.filter(n=>/\.(xlsx|xls|csv)$/i.test(n));if(!valid.length){toast('请选择 .xlsx、.xls 或 .csv 文件。不会读取文件内容。');return;}pendingFiles=[...new Set(valid)];renderPending();if(valid.length<names.length)toast('已忽略不支持的文件类型。');}

function confirmImport(){if(!pendingFiles.length)return;stopRun();model[activeModule].files=[...pendingFiles];model[activeModule].state='imported';appDialog.close();renderBoard();toast('已记录文件名（演示）。未读取文件内容。');}
function badge(status,kind){return `<span class="status-badge ${kind}"><i></i>${status}</span>`;}
function linkedDialog(title='链接表管理'){showDialog('linked',title,`<div class="toolbar"><div class="toolbar-left"><label class="search-shell">${icon('search')}<input type="search" id="linkedSearch" placeholder="搜索示例文件" aria-label="搜索链接表"></label><select id="linkedFilter" aria-label="按表类型筛选"><option value="">全部类型</option><option>账户映射</option><option>网关账单</option><option>业务单据</option></select></div><button class="secondary-btn small-btn" data-action="import">${icon('upload','sm')}导入</button></div><div class="table-shell"><table class="data-table"><thead><tr><th>文件名称</th><th>类型</th><th class="num">数据行数</th><th>导入时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="linkedRows"></tbody></table></div><div class="table-foot"><span id="linkedCount"></span><span>所有数据均为合成示例</span></div>`,{size:'wide',icon:'link',eyebrow:modules[activeModule]+' / 数据管理'});renderLinked();}
function renderLinked(){const q=($('#linkedSearch')?.value||'').trim().toLowerCase(),f=$('#linkedFilter')?.value||'';const rows=linkedFiles.filter(r=>r.name.toLowerCase().includes(q)&&(!f||r.type===f));$('#linkedRows').innerHTML=rows.length?rows.map(r=>`<tr><td><span class="file-cell">${icon('file')}${r.name}</span></td><td class="muted">${r.type}</td><td class="num">${r.count}</td><td class="mono muted">${r.time}</td><td>${badge(r.status,r.kind)}</td><td><button class="text-btn" data-inspect-file="${r.name}">查看</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty-cell">没有匹配的示例文件</td></tr>';$('#linkedCount').textContent=`共 ${rows.length} 条示例记录`;}
function archiveDialog(){showDialog('archive','存档中心',`<div class="toolbar"><div class="toolbar-left"><label class="search-shell">${icon('search')}<input type="search" id="archiveSearch" placeholder="搜索批次号" aria-label="搜索批次号"></label><select id="archiveFilter" aria-label="按模块筛选"><option value="">全部模块</option>${Object.values(modules).map(m=>`<option>${m}</option>`).join('')}</select></div><span class="subtle-badge">${icon('archive','sm')}演示存档</span></div><div class="table-shell"><table class="data-table"><thead><tr><th>批次号 / 创建时间</th><th>所属模块</th><th class="num">原始文件</th><th>状态</th><th>操作</th></tr></thead><tbody id="archiveRows"></tbody></table></div><div class="table-foot"><span id="archiveCount"></span><span>删除仅移除本页演示记录，刷新后恢复</span></div>`,{size:'wide',icon:'archive',eyebrow:'工具箱 / 存档中心'});renderArchives();}
function renderArchives(){if(!$('#archiveRows'))return;const q=($('#archiveSearch')?.value||'').trim().toLowerCase(),f=$('#archiveFilter')?.value||'';const rows=archives.filter(r=>r.id.toLowerCase().includes(q)&&(!f||r.module===f));$('#archiveRows').innerHTML=rows.length?rows.map(r=>`<tr><td class="mono">${r.id}<span class="table-subline">${r.time}</span></td><td>${r.module}</td><td class="num">${r.count} 个</td><td>${badge(r.status,r.kind)}</td><td><button class="text-btn" data-archive-detail="${r.id}">查看</button><button class="text-btn danger" data-delete="${r.id}">删除</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty-cell">没有匹配的演示批次</td></tr>';$('#archiveCount').textContent=`共 ${rows.length} 个示例批次`;}
function deleteDialog(id){const item=archives.find(r=>r.id===id);if(!item)return;confirmDialog.innerHTML=`<header class="dialog-header"><h2 id="confirmTitle">删除批次</h2><button class="icon-btn" data-close="confirm" aria-label="关闭删除确认">${icon('close')}</button></header><div class="dialog-body"><div class="delete-heading">${icon('alert')}<p>删除后，该批次的信息与原始文件将被永久删除，无法恢复。</p></div><div class="delete-target"><strong>${item.id}</strong><p>${item.module} · ${item.count} 个原始文件</p></div><div class="note-box warning">${icon('info')}<p>以上为正式删除提示的样式演示。本原型只移除示例记录，不会访问或删除磁盘上的任何文件。</p></div><label class="checkbox-row"><input type="checkbox" id="deleteAcknowledgement">我已了解此操作不可恢复</label></div><footer class="dialog-footer"><span class="footer-tip">危险操作样式预览</span><div class="dialog-footer-right"><button class="secondary-btn" data-close="confirm">取消</button><button class="danger-btn" id="deleteConfirmBtn" data-confirm-delete="${id}" disabled>永久删除</button></div></footer>`;confirmDialog.showModal();}
function scenariosDialog(){showDialog('scenarios','场景管理',`<p class="section-description">下列名称仅用于展示表格、开关及状态颜色，不代表实际业务规则配置。</p><div class="table-shell"><table class="data-table"><thead><tr><th>场景名称</th><th>说明</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>示例场景 01</td><td class="muted">基础配置展示</td><td>${badge('已启用','success')}</td><td><button class="text-btn" data-demo="这里仅演示场景编辑入口，不修改真实对账规则。">编辑</button></td></tr><tr><td>示例场景 02</td><td class="muted">待完善配置展示</td><td>${badge('待配置','warning')}</td><td><button class="text-btn" data-demo="这里仅演示配置入口，不修改真实对账规则。">配置</button></td></tr><tr><td>示例场景 03</td><td class="muted">停用状态展示</td><td>${badge('未启用','neutral')}</td><td><button class="text-btn" data-demo="场景启用为样式演示，不会改变运行行为。">启用</button></td></tr></tbody></table></div>`,{icon:'sliders',eyebrow:modules[activeModule]});}
function componentsDialog(){showDialog('components','组件样式检查',`<p class="section-description">检查主题在常见组件中的表现。此页面仅用于设计验收，不是新增业务模块。</p><div class="component-grid"><section class="component-block"><h3>按钮 / 可用与禁用</h3><div class="component-buttons">${button('主要操作','demo','primary')}${button('次要操作','demo')}${button('不可用','demo','primary',true)}${button('不可用','demo','secondary',true)}</div></section><section class="component-block"><h3>状态 / 文字与颜色同时区分</h3>${badge('成功','success')}${badge('需确认','warning')}${badge('失败','danger')}${badge('等待处理','neutral')}</section><section class="component-block"><h3>输入 / 默认、聚焦、选择</h3><label class="sr-only" for="demoInput">示例输入</label><input id="demoInput" type="text" placeholder="点击查看聚焦边框" style="width:100%"><label class="sr-only" for="demoSelect">示例下拉框</label><select id="demoSelect" style="width:100%;margin-top:10px"><option>选择对账场景</option> <option>示例场景 01</option></select></section><section class="component-block"><h3>提示 / 成功与异常</h3><div class="note-box success">${icon('circle-check')}<p>示例数据检查通过。</p></div><div class="note-box danger">${icon('alert')}<p>示例：缺少必填字段。</p></div></section></div>`,{size:'wide',icon:'grid',eyebrow:'仅原型 / 主题验收',footer:`<footer class="dialog-footer"><div class="component-buttons"><button class="secondary-btn small-btn" data-component-theme="light">浅色</button><button class="secondary-btn small-btn" data-component-theme="dark">深色</button></div><button class="primary-btn" data-close="app">完成</button></footer>`});}
function guideDialog(){showDialog('guide','原型预览说明',`<div class="module-cards"><div class="note-box">${icon('moon')}<p><strong>切换主题</strong><br>右上角可切换浅色、深色和跟随系统；右下角“设置”进入外观设置。偏好会在浏览器允许时自动保存。</p></div><div class="note-box">${icon('grid')}<p><strong>检查不同界面</strong><br>顶部模块下拉切换三种业务面板；“链接表管理”查看表格，“工具箱 → 存档中心”查看批次和删除确认。</p></div><div class="note-box">${icon('eye')}<p><strong>模拟状态</strong><br>工作区下方切换初始、已导入、运行中、已完成和异常状态。资金模块的“开始运行”只播放演示进度。</p></div><div class="note-box">${icon('shield')}<p><strong>边界</strong><br>HTML 独立运行，无网络请求。文件选择只显示文件名，不读取内容；不执行真实对账、导出或删除。本原型没有修改、创建或推送 Git 分支。</p></div></div>`,{size:'',icon:'book'});}
function cabinetDialog(){showDialog('cabinet','小助手功能收纳',`<p class="section-description">本次原型选取以下三个已有业务面板检查夜间外观。不修改正式版的启用列表与顺序。</p><div class="module-cards">${Object.entries(modules).map(([key,title])=>`<button class="module-card" data-module="${key}">${icon(key==='fund'?'exchange':key==='statement'?'bank':'file')}<div><strong>${title}</strong><p>${key===activeModule?'当前预览模块':'切换到此模块预览'}</p></div>${icon('arrow','end-icon')}</button>`).join('')}</div>`,{size:'compact',icon:'grid'});}
function exportDialog(){showDialog('export','导出预览',`<div class="note-box success">${icon('circle-check')}<p>已进入示例结果可导出的状态。</p></div><p class="section-description" style="margin-top:18px;margin-bottom:0">主题只影响界面外观，正式导出的表格格式不应跟随深色主题改变。此原型不包含对账引擎，不生成或保存业务文件。</p>`,{size:'compact',icon:'download'});}
function resultDialog(){showDialog('result','结果确认',`<div class="note-box warning">${icon('info')}<p>下列数字和状态仅用于外观展示，不来自真实处理结果。</p></div><div class="table-shell" style="margin-top:18px"><table class="data-table"><thead><tr><th>示例检查项</th><th class="num">记录数</th><th>状态</th></tr></thead><tbody><tr><td>通过记录</td><td class="num">1,245</td><td>${badge('通过','success')}</td></tr><tr><td>待确认记录</td><td class="num">3</td><td>${badge('待确认','warning')}</td></tr></tbody></table></div>`,{icon:'circle-check',size:'compact'});}
function open(name){const f={appearance:appearanceDialog,palette:paletteDialog,archive:archiveDialog,components:componentsDialog,guide:guideDialog,cabinet:cabinetDialog};if(f[name])f[name]();}
function handleAction(action){switch(action){case'import':return importDialog();case'import-template':return importDialog(true);case'run':return runDemo();case'export':return exportDialog();case'linked':return linkedDialog();case'templates':return linkedDialog('模板管理 · 示例');case'mapping':return linkedDialog('账户映射 · 示例');case'scenarios':return scenariosDialog();case'result':return resultDialog();case'theme-reset':return setTheme('system');case'pick-files':$('#filePicker').value='';return $('#filePicker').click();case'sample-files':pendingFiles=['银行对账单_202609_示例.xlsx','网关账单_202609_示例.xlsx','业务单据_202609_示例.xlsx'];return renderPending();case'confirm-import':return confirmImport();case'demo':return toast('组件按钮交互正常；此操作仅为外观演示。');}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b){if(!e.target.closest('.popover'))closeMenus();return;}if(b.disabled)return;
 if(b.id==='themeTrigger')return toggleMenu('themeMenu',b);if(b.id==='moduleSwitcherBtn')return toggleMenu('moduleMenu',b);if(b.id==='toolboxTrigger')return toggleMenu('toolboxMenu',b);
 if(b.dataset.themeSet){setTheme(b.dataset.themeSet);closeMenus();$('#themeTrigger').focus();return;}
 if(b.hasAttribute('data-theme-light'))return setTheme('light');if(b.dataset.componentTheme)return setTheme(b.dataset.componentTheme);
 if(b.dataset.open)return open(b.dataset.open);if(b.dataset.module)return selectModule(b.dataset.module);
 if(b.dataset.state)return setState(b.dataset.state);if(b.dataset.action)return handleAction(b.dataset.action);
 if(b.dataset.close)return(b.dataset.close==='confirm'?confirmDialog:appDialog).close();
 if(b.dataset.bg){lightBackground=b.dataset.bg;const saved=persist('bbet-v329-preview-background',lightBackground);updateTheme(false);if($('#savedBgName'))$('#savedBgName').textContent=backgrounds[lightBackground].name;if(!saved)toast('背景已切换；当前浏览器不允许保存偏好。');return;}
 if(b.dataset.delete)return deleteDialog(b.dataset.delete);
 if(b.dataset.confirmDelete){const id=b.dataset.confirmDelete,i=archives.findIndex(r=>r.id===id);if(i>=0)archives.splice(i,1);confirmDialog.close();renderArchives();toast('演示记录已移除；未删除任何磁盘文件。');return;}
 if(b.dataset.archiveDetail){const r=archives.find(x=>x.id===b.dataset.archiveDetail);if(r)toast(`${r.id} · ${r.module} · ${r.count} 个示例原始文件`);return;}
 if(b.dataset.inspectFile)return toast(b.dataset.inspectFile+'：示例记录，不读取磁盘文件。');
 if(b.dataset.demo)return toast(b.dataset.demo);
 if(b.dataset.windowDemo)return toast('浏览器原型不控制应用窗口；此按钮仅展示'+b.dataset.windowDemo+'样式。');
 if(!b.closest('.popover'))closeMenus();
});
document.addEventListener('change',e=>{if(e.target.matches('input[name="appearance"]'))setTheme(e.target.value,false);if(e.target.id==='deleteAcknowledgement')$('#deleteConfirmBtn').disabled=!e.target.checked;if(e.target.id==='linkedFilter')renderLinked();if(e.target.id==='archiveFilter')renderArchives();if(e.target.id==='statementMode')businessSelectors.statement=e.target.value;if(e.target.id==='positionFunction')businessSelectors.position=e.target.value;});
document.addEventListener('input',e=>{if(e.target.id==='linkedSearch')renderLinked();if(e.target.id==='archiveSearch')renderArchives();});
$('#filePicker').addEventListener('change',e=>acceptFiles(Array.from(e.target.files).map(f=>f.name)));
// Keep file drops local to the preview; never navigate to a dropped file.
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
 const visible=$$('.popover').find(p=>!p.hidden);if(!visible)return;
 const trigger={themeMenu:'themeTrigger',moduleMenu:'moduleSwitcherBtn',toolboxMenu:'toolboxTrigger'}[visible.id];
 if(e.key==='Escape'){e.preventDefault();closeMenus();$('#'+trigger).focus();return;}
 if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=$$('button:not(:disabled)',visible),n=items.length;let i=items.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?n-1:e.key==='ArrowDown'?(i+1+n)%n:(i-1+n)%n;items[i].focus();}
 if(e.key==='Tab')closeMenus();
});
appDialog.addEventListener('close',()=>{activeDialog='';});
[appDialog,confirmDialog].forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
updateTheme(false);renderBoard();
</script>
</body>
</html>
