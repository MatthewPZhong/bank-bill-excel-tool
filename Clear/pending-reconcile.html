<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Pending 开始运行 · Gemini</title>
<link rel="stylesheet" href="styles-gemini.css" />
<link rel="stylesheet" href="styles-gemini-extra.css?v3" />
</head>
<body>
<div class="app-shell">
  <header class="window-bar">
    <div class="drag-region"></div>
    <div class="window-actions no-drag">
      <button class="window-btn">−</button><button class="window-btn">□</button><button class="window-btn close-btn">×</button>
    </div>
  </header>
  <div class="corner-gif-slot" aria-hidden="true">🐱</div>

  <div class="modal-overlay">
    <div class="modal-card pending-reconcile-card">
      <div class="dialog-header">
        <div class="dialog-title">请选取需要比对 Pending 数据的月份</div>
      </div>
      <div class="pending-reconcile-form">
        <div class="pending-reconcile-label">上上个月 Pending 文件</div>
        <div class="pending-reconcile-label">上个月 Pending 文件</div>
        <select class="pending-reconcile-select" data-role="prev-prev">
          <option selected>2026-02</option>
          <option>2026-01</option>
          <option>2025-12</option>
        </select>
        <select class="pending-reconcile-select" data-role="prev">
          <option selected>2026-03</option>
          <option>2026-02</option>
          <option>2026-01</option>
        </select>
      </div>
      <div class="dialog-actions center">
        <button class="primary-btn small" type="button" data-action="done">完成</button>
        <button class="secondary-btn small" type="button" data-action="cancel">取消</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
