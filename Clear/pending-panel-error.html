<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Pending 主面板 · 错误 · Gemini</title>
<link rel="stylesheet" href="styles-gemini.css" />
<link rel="stylesheet" href="styles-gemini-extra.css?v3" />
</head>
<body>
<div class="app-shell">
  <header class="window-bar">
    <div class="drag-region"></div>
    <div class="window-actions no-drag">
      <button class="window-btn" type="button">−</button>
      <button class="window-btn" type="button">□</button>
      <button class="window-btn close-btn" type="button">×</button>
    </div>
  </header>

  <div class="corner-gif-slot" aria-hidden="true">🐱</div>

  <main class="page-body">
    <h1 class="page-title"><span class="gemini-gradient">网银账单小助手</span></h1>

    <section class="workspace-shell">
      <div class="module-switcher">
        <button class="module-switcher-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="module-switcher-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><defs><linearGradient id="gs-perr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4285F4"/><stop offset="40%" stop-color="#9B72F2"/><stop offset="75%" stop-color="#E95EA2"/><stop offset="100%" stop-color="#F6B93B"/></linearGradient></defs><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" fill="url(#gs-perr)"/></svg>
          </span>
          <span class="module-switcher-name">月度 Pending 数据核对</span>
          <span class="module-switcher-caret" aria-hidden="true">▾</span>
        </button>
      </div>

      <section class="control-board module-panel pending-board">
        <div class="control-row">
          <div class="cell left">
            <button class="secondary-btn" type="button">规则管理</button>
          </div>
          <div class="cell right">
            <div class="pending-action-pair">
              <button class="primary-btn" type="button">导入文件</button>
              <button class="primary-btn" type="button" disabled>开始运行</button>
            </div>
          </div>
        </div>

        <div class="control-row">
          <div class="cell left">
            <button class="secondary-btn" type="button" disabled>导出差异</button>
          </div>
          <div class="cell right">
            <div class="pending-status" data-tone="error">
              表头字段不一致，请检查并重新导入，点击导出报错文件。
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <footer class="page-footer">
    <div class="version-text"><span class="version-label">Version</span> 2.0.0-beta.1</div>
  </footer>

  <div class="background-tool">
    <div class="background-tool-actions">
      <button class="palette-trigger" type="button"><span aria-hidden="true">🎨</span></button>
      <button class="text-action" type="button">使用手册</button>
    </div>
  </div>
</div>
</body>
</html>
