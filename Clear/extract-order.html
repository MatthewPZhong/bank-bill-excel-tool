<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>确认大账号顺序 · Gemini</title>
<link rel="stylesheet" href="styles-gemini.css" />
<link rel="stylesheet" href="styles-gemini-extra.css?v3" />
</head>
<body>
<div class="app-shell">
  <header class="window-bar">
    <div class="drag-region"></div>
    <div class="window-actions no-drag">
      <button class="window-btn">−</button><button class="window-btn">□</button><button class="window-btn close-btn">×</button>
    </div>
  </header>
  <div class="corner-gif-slot" aria-hidden="true">🐱</div>

  <div class="modal-overlay">
    <div class="modal-card extract-order-card">
      <div class="dialog-header">
        <div class="dialog-title">确认大账号顺序</div>
        <button class="icon-close" type="button" style="margin-left:auto;">×</button>
      </div>

      <div class="extract-order-body">
        <div>
          <div class="extract-order-col-header">文件顺序：</div>
          <div class="extract-order-list">
            <div class="extract-order-row">
              <span class="eo-idx">1.</span>
              <span class="eo-name">HSBC-SG-2026-03.xlsx</span>
              <span></span>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">2.</span>
              <span class="eo-name">HSBC-SG-2026-03-block2.xlsx</span>
              <span></span>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">3.</span>
              <span class="eo-name">BankABC-HK-2026-03.xlsx</span>
              <span></span>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">4.</span>
              <span class="eo-name">PingPong-US-2026-03.xlsx</span>
              <span></span>
            </div>
          </div>
        </div>

        <div>
          <div class="extract-order-col-header">大账号信息：</div>
          <div class="extract-order-list">
            <div class="extract-order-row">
              <span class="eo-idx">1.</span>
              <span class="eo-name">6222000000000001 USD</span>
              <button class="text-action eo-edit" type="button">编辑</button>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">2.</span>
              <span class="eo-name">6222000000000001 HKD</span>
              <button class="text-action eo-edit" type="button">编辑</button>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">3.</span>
              <span class="eo-name">9558800000000008 SGD</span>
              <button class="text-action eo-edit" type="button">编辑</button>
            </div>
            <div class="extract-order-row">
              <span class="eo-idx">4.</span>
              <span class="eo-name">4567000000000003 USD</span>
              <button class="text-action eo-edit" type="button">编辑</button>
            </div>
          </div>
        </div>
      </div>

      <div class="dialog-actions right">
        <button class="primary-btn small" type="button">完成</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
