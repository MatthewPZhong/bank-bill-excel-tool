<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>提示弹窗 · Gemini</title>
<link rel="stylesheet" href="styles-gemini.css" />
<link rel="stylesheet" href="styles-gemini-extra.css?v2" />
</head>
<body>
<div class="app-shell">
  <header class="window-bar">
    <div class="drag-region"></div>
    <div class="window-actions no-drag">
      <button class="window-btn">−</button><button class="window-btn">□</button><button class="window-btn close-btn">×</button>
    </div>
  </header>
  <div class="corner-gif-slot" aria-hidden="true">🐱</div>

  <div class="modal-overlay">
    <div class="modal-card alert-card">
      <div class="alert-body">
        <div class="alert-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <defs><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4285F4"/><stop offset="100%" stop-color="#9B72F2"/></linearGradient></defs>
            <circle cx="12" cy="12" r="10" fill="none" stroke="url(#ai)" stroke-width="2"/>
            <path d="M12 7v6M12 16v1" stroke="url(#ai)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="alert-message">
          模板 <strong>LusoBank-MO</strong> 导入成功，共解析 <strong>248</strong> 条记录；其中 <strong>3</strong> 条字段缺失，已标记为"待确认"。
        </div>
      </div>
      <div class="dialog-actions right">
        <button class="secondary-btn small" type="button">查看报告</button>
        <button class="primary-btn small" type="button">确定</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
