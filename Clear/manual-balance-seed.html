<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>补录上一账单日余额 · Gemini</title>
<link rel="stylesheet" href="styles-gemini.css" />
<link rel="stylesheet" href="styles-gemini-extra.css?v2" />
</head>
<body>
<div class="app-shell">
  <header class="window-bar">
    <div class="drag-region"></div>
    <div class="window-actions no-drag">
      <button class="window-btn">−</button><button class="window-btn">□</button><button class="window-btn close-btn">×</button>
    </div>
  </header>
  <div class="corner-gif-slot" aria-hidden="true">🐱</div>

  <div class="modal-overlay">
    <div class="modal-card manual-balance-card">
      <div class="dialog-header">
        <div class="dialog-title"><span class="gemini-gradient">补录上一账单日余额</span></div>
        <button class="icon-close" type="button">×</button>
      </div>

      <div class="manual-balance-context">
        <div class="manual-balance-progress">
          <span class="manual-balance-progress-chip">第 <strong>2</strong> 个账号，共 <strong>5</strong> 个</span>
          <div class="manual-balance-progress-bar">
            <div class="manual-balance-progress-bar-fill" style="width:40%"></div>
          </div>
        </div>
        <div class="manual-balance-context-grid">
          <div class="manual-balance-context-row">
            <span class="manual-balance-context-label">银行账号</span>
            <span class="manual-balance-context-value manual-balance-context-account" title="6222 0000 0000 0012345">6222 0000 0000 0012345</span>
          </div>
          <div class="manual-balance-context-row">
            <span class="manual-balance-context-label">币种</span>
            <span class="manual-balance-context-tag">USD</span>
          </div>
          <div class="manual-balance-context-row">
            <span class="manual-balance-context-label">当前账单日期</span>
            <span class="manual-balance-context-value">2024-11-01</span>
          </div>
        </div>
      </div>

      <div class="manual-balance-form">
        <label class="manual-balance-row">
          <span class="manual-balance-label">请选择上一账单日日期</span>
          <input class="mapping-text-input manual-balance-input manual-balance-date-input" type="date" value="2024-10-01" />
        </label>
        <label class="manual-balance-row">
          <span class="manual-balance-label">请输入上一账单日余额</span>
          <input class="mapping-text-input manual-balance-input manual-balance-amount-input" type="text" spellcheck="false" value="128,450.00" />
        </label>
      </div>
      <div class="dialog-actions right">
        <button class="primary-btn small" type="button" data-action="done">完成</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
