name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  bizop-durability-contract:
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'codex/v3.2.7-') || github.head_ref == 'codex/v327-enable-bizop-production')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify BizOP contracts with a real directory durability barrier
        run: |
          node -e "if (require('./tests/helpers/durable-directory-tests').directoryDurabilityCapability.capability !== 'supported') process.exit(1)"
          node --test tests/unit/main-process/biz-op-v327*.test.js

  # v3.2.15 B43：release-check 拆成下面三个并行 job（lint + 架构检查 + smoke、单测 3 片、集成测试 2 片），
  #   各 job 沿用 smoke-test 的 v3.2.1 final gate 守卫、exact head checkout、一次性修复血缘与 release-check 运行条件；
  #   smoke-test 汇总各 job 结果（scripts/ci/verify-release-check-jobs.js）后再跑 Windows 专项步骤，必需检查名不变。
  #   本地 npm run release-check 的入口与内容不变。
  release-check-static:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Reject unauthorized v3.2.1 final-gate invocation
        if: >-
          (
            (
              github.event_name == 'pull_request' &&
              (
                github.head_ref == 'codex/v3.2.1-r3-release-evidence' ||
                github.head_ref == 'codex/v3.2.1-r4-review-hardening'
              )
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              (
                github.ref_name == 'codex/v3.2.1-r3-release-evidence' ||
                github.ref_name == 'codex/v3.2.1-r4-review-hardening'
              )
            )
          ) &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          )
        run: |
          echo "Unauthorized v3.2.1 final release-gate invocation"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify authorized v3.2.1 repair lineage
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 183 &&
          github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
          github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'synchronize' &&
          github.event.pull_request.commits == 6 &&
          github.run_attempt == 1
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^1)" = "f87f2b2994e86b75d350f64eec53252fe24a67b6"
          test "$(git rev-parse HEAD^1^1)" = "ce599e206894f3683b748254068dd750479ffc74"
          test "$(git rev-parse HEAD^1^2)" = "d7d96938196a61a36892c40721cdba56992a14a8"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve architecture policy comparison
        id: architecture-policy
        env:
          ARCHITECTURE_EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.ref_type != 'tag' && github.event.before || '' }}
          ARCHITECTURE_EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/architecture/ci-policy-base.js

      - name: Run lint, architecture and smoke checks
        env:
          ARCHITECTURE_BASE_REF: ${{ steps.architecture-policy.outputs.base }}
        if: >-
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          ) ||
          (
            (github.event_name != 'pull_request' ||
             github.head_ref != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'workflow_dispatch' ||
             github.ref_name != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name != github.repository ||
             !startsWith(github.head_ref, 'codex/v3.2.1-'))
          )
        run: npm run lint && npm run check:architecture && npm run smoke

  release-check-unit:
    name: release-check-unit (${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Reject unauthorized v3.2.1 final-gate invocation
        if: >-
          (
            (
              github.event_name == 'pull_request' &&
              (
                github.head_ref == 'codex/v3.2.1-r3-release-evidence' ||
                github.head_ref == 'codex/v3.2.1-r4-review-hardening'
              )
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              (
                github.ref_name == 'codex/v3.2.1-r3-release-evidence' ||
                github.ref_name == 'codex/v3.2.1-r4-review-hardening'
              )
            )
          ) &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          )
        run: |
          echo "Unauthorized v3.2.1 final release-gate invocation"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify authorized v3.2.1 repair lineage
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 183 &&
          github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
          github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'synchronize' &&
          github.event.pull_request.commits == 6 &&
          github.run_attempt == 1
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^1)" = "f87f2b2994e86b75d350f64eec53252fe24a67b6"
          test "$(git rev-parse HEAD^1^1)" = "ce599e206894f3683b748254068dd750479ffc74"
          test "$(git rev-parse HEAD^1^2)" = "d7d96938196a61a36892c40721cdba56992a14a8"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests shard
        env:
          UNIT_TEST_SHARD: ${{ matrix.shard }}/3
        if: >-
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          ) ||
          (
            (github.event_name != 'pull_request' ||
             github.head_ref != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'workflow_dispatch' ||
             github.ref_name != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name != github.repository ||
             !startsWith(github.head_ref, 'codex/v3.2.1-'))
          )
        run: npm run test:unit

  release-check-integration:
    name: release-check-integration (${{ matrix.shard }}/2)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Reject unauthorized v3.2.1 final-gate invocation
        if: >-
          (
            (
              github.event_name == 'pull_request' &&
              (
                github.head_ref == 'codex/v3.2.1-r3-release-evidence' ||
                github.head_ref == 'codex/v3.2.1-r4-review-hardening'
              )
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              (
                github.ref_name == 'codex/v3.2.1-r3-release-evidence' ||
                github.ref_name == 'codex/v3.2.1-r4-review-hardening'
              )
            )
          ) &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          )
        run: |
          echo "Unauthorized v3.2.1 final release-gate invocation"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify authorized v3.2.1 repair lineage
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 183 &&
          github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
          github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'synchronize' &&
          github.event.pull_request.commits == 6 &&
          github.run_attempt == 1
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^1)" = "f87f2b2994e86b75d350f64eec53252fe24a67b6"
          test "$(git rev-parse HEAD^1^1)" = "ce599e206894f3683b748254068dd750479ffc74"
          test "$(git rev-parse HEAD^1^2)" = "d7d96938196a61a36892c40721cdba56992a14a8"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests shard
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}/2
          INTEGRATION_CONCURRENCY: '2'
        if: >-
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          ) ||
          (
            (github.event_name != 'pull_request' ||
             github.head_ref != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'workflow_dispatch' ||
             github.ref_name != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name != github.repository ||
             !startsWith(github.head_ref, 'codex/v3.2.1-'))
          )
        run: npm run test:integration

  smoke-test:
    needs: [release-check-static, release-check-unit, release-check-integration]
    # 依赖 job 失败时仍运行本 job 并在 Run release checks 失败，避免必需检查显示为 skipped。
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Reject unauthorized v3.2.1 final-gate invocation
        if: >-
          (
            (
              github.event_name == 'pull_request' &&
              (
                github.head_ref == 'codex/v3.2.1-r3-release-evidence' ||
                github.head_ref == 'codex/v3.2.1-r4-review-hardening'
              )
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              (
                github.ref_name == 'codex/v3.2.1-r3-release-evidence' ||
                github.ref_name == 'codex/v3.2.1-r4-review-hardening'
              )
            )
          ) &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          )
        run: |
          echo "Unauthorized v3.2.1 final release-gate invocation"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify authorized v3.2.1 repair lineage
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 183 &&
          github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
          github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action == 'synchronize' &&
          github.event.pull_request.commits == 6 &&
          github.run_attempt == 1
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^1)" = "f87f2b2994e86b75d350f64eec53252fe24a67b6"
          test "$(git rev-parse HEAD^1^1)" = "ce599e206894f3683b748254068dd750479ffc74"
          test "$(git rev-parse HEAD^1^2)" = "d7d96938196a61a36892c40721cdba56992a14a8"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify memory package identity on Windows
        run: node scripts/integration/packaged-memory-identity.js

      - name: Verify common feedback keyboard and layout on Windows
        run: node scripts/test-renderer-lifecycle.js common-feedback-dialog-scroll

      - name: Run release checks
        env:
          RELEASE_CHECK_JOB_RESULTS: ${{ toJSON(needs) }}
        if: >-
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.number == 183 &&
            github.head_ref == 'codex/v3.2.1-r4-review-hardening' &&
            github.base_ref == 'codex/v3.2.1-r3-release-evidence' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.action == 'synchronize' &&
            github.event.pull_request.commits == 6 &&
            github.run_attempt == 1
          ) ||
          (
            (github.event_name != 'pull_request' ||
             github.head_ref != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'workflow_dispatch' ||
             github.ref_name != 'codex/v3.2.1-r4-review-hardening') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name != github.repository ||
             !startsWith(github.head_ref, 'codex/v3.2.1-'))
          )
        run: node scripts/ci/verify-release-check-jobs.js

      - name: Verify Windows startup process adapter semantics
        env:
          WINDOWS_STARTUP_PROCESS_ADAPTER_REAL_TEST: '1'
        run: node --test tests/unit/scripts/startup-process-adapter.test.js

      - name: Verify Windows packaged canary process semantics
        env:
          WINDOWS_PACKAGED_CANARY_PROCESS_REAL_TEST: '1'
        run: node --test --test-concurrency=1 tests/unit/windows-build-contract.test.js

      - name: Verify carrier closure in Windows Electron
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          & .\node_modules\electron\dist\electron.exe --test tests/unit/main-process/background-execution/carrier-observation.test.js tests/unit/main-process/toolbox-background-generation.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows SQLite teardown regression
        run: node --test tests/unit/main-process/position-reconciliation-filtered-source-report.test.js

      - name: Verify main panel alignment
        run: npm run verify:main-panel-alignment

  build:
    needs: smoke-test
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: |
          npm run prepare:dist
          npx electron-builder --win --x64 --publish never

      - name: Check dist size
        run: node scripts/check-dist-size.js

      - name: Run packaged background execution canary
        shell: pwsh
        run: ./scripts/run-windows-packaged-background-canary.ps1 -DistDirectory ./dist

      - name: Verify packaged normal startup and complete BizOP workflow
        shell: pwsh
        run: |
          $env:BIZOP_ACCEPTANCE_APP = (Resolve-Path 'dist/win-unpacked/清结算小助手.exe').Path
          node scripts/biz-op-v327/verify-windows-app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packaged BizOP acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bizop-packaged-acceptance
          path: outputs/windows-bizop-packaged-acceptance/
          if-no-files-found: warn

      - name: Stage updater-compatible assets
        run: npm run stage:update-artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          retention-days: 1
          path: |
            dist/bank-bill-excel-tool-setup-*.exe
            dist/bank-bill-excel-tool-setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-exe
          retention-days: 1
          path: |
            dist/bank-bill-excel-tool-portable-*.exe
          if-no-files-found: error
