name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        run: npm run smoke

      - name: Verify main panel alignment
        run: npm run verify:main-panel-alignment

  build:
    if: github.event_name != 'pull_request'
    needs: smoke-test
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: |
          npm run prebuild:meta
          npx electron-builder --win --publish never

      - name: Check dist size
        run: node scripts/check-dist-size.js

      - name: Stage updater-compatible assets
        run: npm run stage:update-artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          retention-days: 1
          path: |
            dist/bank-bill-excel-tool-setup-*.exe
            dist/bank-bill-excel-tool-setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-exe
          retention-days: 1
          path: |
            dist/bank-bill-excel-tool-portable-*.exe
          if-no-files-found: error
