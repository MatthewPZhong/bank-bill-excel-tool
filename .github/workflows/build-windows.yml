name: Windows v3.2.9 Short Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-short-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node matching the failed Windows run
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Record revision and runtime identity
        id: identity
        run: node scripts/diagnostics/windows-short-diagnostics.cjs identity
      - name: Install locked dependencies
        id: install
        run: |
          npm ci 2>&1 | Tee-Object -FilePath outputs/windows-short-diagnostics/npm-ci.log
          exit $LASTEXITCODE
      - name: Run SSD admission regression tests
        if: always() && steps.install.outcome == 'success' && steps.identity.outcome == 'success'
        run: node scripts/diagnostics/windows-short-diagnostics.cjs ssd-tests
      - name: Collect actual Windows volume and disk evidence
        if: always() && steps.install.outcome == 'success' && steps.identity.outcome == 'success'
        run: node scripts/diagnostics/windows-short-diagnostics.cjs disk
      - name: Capture original migration guard and native file identity changes
        if: always() && steps.install.outcome == 'success' && steps.identity.outcome == 'success'
        run: node scripts/diagnostics/windows-short-diagnostics.cjs migration
      - name: Recheck readonly and position fixtures on native Windows
        if: always() && steps.install.outcome == 'success' && steps.identity.outcome == 'success'
        run: node scripts/diagnostics/windows-short-diagnostics.cjs fixtures
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-short-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/windows-short-diagnostics/
          retention-days: 7
          if-no-files-found: error
