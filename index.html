<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>清结算小助手</title>
    <link id="cssFonts" rel="stylesheet" href="./src/fonts.css" />
    <link id="cssClear" rel="stylesheet" href="./src/styles-gemini.css" />
    <link id="cssClearExtra" rel="stylesheet" href="./src/styles-gemini-extra.css" />
    <link rel="stylesheet" href="./src/styles-vcc-financial-op.css" />
    <link rel="stylesheet" href="./src/styles-biz-op-v327.css" />
  </head>
  <body data-style="clear">
    <div id="appShell" class="app-shell">
      <header class="window-bar">
        <div class="drag-region"></div>
        <div class="window-actions no-drag">
          <button id="minimizeBtn" class="window-btn" type="button" aria-label="最小化">-</button>
          <button id="maximizeBtn" class="window-btn" type="button" aria-label="最大化">□</button>
          <button id="closeBtn" class="window-btn close-btn" type="button" aria-label="关闭">×</button>
        </div>
      </header>

      <img class="corner-gif" src="./assets/cat-meme.gif" alt="gif" />

      <main class="page-body">
        <h1 class="page-title"><span class="gemini-gradient">清结算小助手</span></h1>

        <section class="workspace-shell">
          <div class="module-switcher">
            <button id="moduleSwitcherBtn" class="module-switcher-trigger" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="module-switcher-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16"><defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4285F4"/><stop offset="40%" stop-color="#9B72F2"/><stop offset="75%" stop-color="#E95EA2"/><stop offset="100%" stop-color="#F6B93B"/></linearGradient></defs><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" fill="url(#gs)"/></svg>
              </span>
              <span id="currentModuleName" class="module-switcher-name">网银账单生成</span>
              <span class="module-switcher-caret" aria-hidden="true">▾</span>
            </button>
            <div id="moduleSwitcherMenu" class="module-switcher-menu" hidden>
              <!-- v2.1.4 T3：module-option 改为运行时按 state.enabledModules 动态渲染（renderTopModuleSwitcher） -->
              <!-- 用户通过 🔄 收纳弹窗调整启用列表 + 顺序后，本容器即时 re-render -->
            </div>
          </div>

          <section id="statementModulePanel" class="control-board module-panel">
            <div class="control-row">
              <div class="cell left">
                <button id="importFileBtn" class="primary-btn" type="button">导入文件</button>
              </div>
              <div class="cell center">
                <label class="select-label main-panel-select-label" for="templateSelect">模式</label>
                <div class="select-shell">
                  <select id="templateSelect" class="template-select main-panel-select-control">
                    <option value="create-statement">制作网银账单</option>
                    <option value="export-monthly-balance">导出月度余额账单</option>
                  </select>
                </div>
              </div>
              <div class="cell right">
                <div class="export-actions">
                  <button id="exportDetailBtn" class="primary-btn" type="button" disabled>导出明细</button>
                  <button id="exportBalanceBtn" class="secondary-btn export-balance-btn" type="button" disabled>导出余额</button>
                </div>
              </div>
            </div>

            <div class="control-row">
              <div class="cell left">
                <button id="importTemplateBtn" class="secondary-btn" type="button">导入模板</button>
              </div>
              <div class="cell center">
                <label class="select-label" aria-hidden="true" style="visibility:hidden;">模式</label>
                <div class="button-stack" style="flex:1; max-width:260px; gap:12px; flex-wrap:nowrap;">
                  <button id="manageTemplateBtn" class="secondary-btn" type="button" style="flex:1; min-width:0;">模板管理</button>
                  <button id="accountMappingBtn" class="secondary-btn" type="button" style="flex:1; min-width:0;">账户映射</button>
                </div>
              </div>
              <div class="cell right">
                <div id="statusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <section id="newAccountModulePanel" class="control-board new-account-panel" hidden>
            <div class="new-account-title">仅支持开户至今未发生交易的账户余额导出</div>
            <div id="newAccountRows">
              <div class="new-account-form-row" data-new-account-row="true">
                <label class="new-account-field">
                  <span class="new-account-label">银行名称</span>
                  <input id="newAccountBankNameInput" class="new-account-input new-account-bank-name-input" type="text" spellcheck="false" />
                </label>
                <label class="new-account-field">
                  <span class="new-account-label">所在地</span>
                  <input id="newAccountLocationInput" class="new-account-input new-account-location-input" type="text" spellcheck="false" />
                </label>
                <label class="new-account-field">
                  <span class="new-account-label">币种</span>
                  <div class="new-account-currency-row">
                    <input id="newAccountCurrencyInput" class="new-account-input new-account-currency-input" type="hidden" spellcheck="false" />
                    <div id="newAccountCurrencyDropdownWrap" class="new-account-currency-dropdown-wrap">
                      <button
                        id="newAccountCurrencyDropdownBtn"
                        class="new-account-input new-account-currency-dropdown-btn"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                      ></button>
                      <div id="newAccountCurrencyDropdownPanel" class="new-account-currency-dropdown-panel" hidden></div>
                    </div>
                    <label class="new-account-checkbox-label">
                      <input id="newAccountMultiCurrencyCheckbox" class="new-account-checkbox new-account-multi-currency-checkbox" type="checkbox" />
                      <span class="new-account-checkbox-text">多币种账户</span>
                    </label>
                  </div>
                </label>
                <label class="new-account-field">
                  <span class="new-account-label new-account-label-with-action">
                    银行账号
                    <button
                      id="newAccountAddRowBtn"
                      class="text-action new-account-row-action-btn new-account-add-btn"
                      type="button"
                      data-row-action="add"
                    >新增</button>
                  </span>
                  <div class="new-account-bank-account-row">
                    <input id="newAccountBankAccountInput" class="new-account-input new-account-bank-account-input" type="text" spellcheck="false" />
                  </div>
                </label>
                <label class="new-account-field">
                  <span class="new-account-label">开户日期</span>
                  <input id="newAccountOpenDateInput" class="new-account-input new-account-open-date-input" type="text" value="" />
                </label>
              </div>
            </div>
            <div class="new-account-actions-row">
              <div id="newAccountStatusBox" class="status-box new-account-status-box">
                <span class="status-box-text">等待生成</span>
              </div>
              <div class="new-account-actions">
                <button id="newAccountGenerateBtn" class="primary-btn" type="button" disabled>生成</button>
                <button id="newAccountExportBtn" class="secondary-btn" type="button" disabled>导出</button>
              </div>
            </div>
          </section>

          <section id="pendingModulePanel" class="control-board module-panel pending-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <button id="pendingRuleBtn" class="secondary-btn" type="button">规则管理</button>
              </div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="pendingImportBtn" class="primary-btn" type="button" disabled>导入文件</button>
                  <button id="pendingRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <button id="pendingExportBtn" class="secondary-btn" type="button" disabled>导出差异</button>
              </div>
              <div class="cell right">
                <div id="pendingStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">初次使用请确认用来筛选的字段~</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v2.1.3：业务OP数据核对模块面板（PRD §3.1 / spec §7.1）
               v2.1.3-fix1：BU 下拉框移至 row1 左侧（占据原"规则管理"位置），样式与"模式"下拉对齐 -->
          <section id="bizOpV327ModulePanel" class="control-board module-panel pending-board" hidden></section>
          <section id="bizOpReconModulePanel" class="control-board module-panel pending-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <div id="bizOpReconBuRow" class="biz-op-recon-bu-row">
                  <label class="select-label main-panel-select-label" for="bizOpReconBuSelect">BU</label>
                  <div class="select-shell">
                    <select id="bizOpReconBuSelect" class="template-select main-panel-select-control">
                      <option value=""></option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="bizOpReconImportBtn" class="primary-btn" type="button">导入文件</button>
                  <button id="bizOpReconRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <button id="bizOpReconExportBtn" class="secondary-btn" type="button" disabled>导出差异</button>
              </div>
              <div class="cell right">
                <div id="bizOpReconStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v2.1.2 T2：月度银行对账单BU回填校验模块面板（PRD §3.2.5：导入按钮 → 月份对话框 → 文件选择）-->
          <section id="bankBuReconModulePanel" class="control-board module-panel pending-board layout-mirrored" hidden>
            <div class="control-row">
              <div class="cell left"></div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="bankBuReconImportBtn" class="primary-btn" type="button">导入文件</button>
                  <button id="bankBuReconRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <button id="bankBuReconExportBtn" class="secondary-btn" type="button" disabled>导出差异</button>
              </div>
              <div class="cell right">
                <div id="bankBuReconStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v3.0.15：重复入金匹配模块（布局与月度银行对账单BU回填校验一致）-->
          <section id="duplicateInboundMatchModulePanel" class="control-board module-panel pending-board layout-mirrored" hidden>
            <div class="control-row">
              <div class="cell left"></div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="duplicateInboundMatchImportBtn" class="primary-btn" type="button">导入文件</button>
                  <button id="duplicateInboundMatchRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <button id="duplicateInboundMatchExportBtn" class="secondary-btn" type="button" disabled>导出文件</button>
              </div>
              <div class="cell right">
                <div id="duplicateInboundMatchStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v2.1.12 需求1：VCC业务OP计算模块面板（仿 bank-bu-recon；「导出差异」位 →「显示余额」）-->
          <section id="vccOpCalcModulePanel" class="control-board module-panel pending-board layout-mirrored" hidden>
            <div class="control-row">
              <div class="cell left"></div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="vccOpCalcImportBtn" class="primary-btn" type="button">导入文件</button>
                  <button id="vccOpCalcRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <button id="vccOpCalcShowBalanceBtn" class="secondary-btn" type="button" disabled>显示余额</button>
              </div>
              <div class="cell right">
                <div id="vccOpCalcStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v3.1.6：VCC财务OP校验（布局沿用收单单据币种校验）。 -->
          <section id="vccFinancialOpModulePanel" class="control-board module-panel acquiring-bill-currency-board vcc-financial-op-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <div class="pending-action-pair">
                  <button id="vccFinancialOpImportBtn" class="secondary-btn" type="button">导入文件</button>
                  <button id="vccFinancialOpRunBtn" class="primary-btn" type="button">开始运行</button>
                </div>
              </div>
              <div class="cell right">
                <button id="vccFinancialOpExportBtn" class="secondary-btn" type="button" disabled>导出校验结果表</button>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <div id="vccFinancialOpStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
              <div class="cell right">
                <button id="vccFinancialOpDataManagerBtn" class="secondary-btn" type="button">数据管理</button>
              </div>
            </div>
          </section>

          <!-- v2.1.14 B（用户反馈还原）：资金对账数据处理模块面板还原为 v2.1.13 的 layout-mirrored + 3 个 control-row
               （复用舒展留白 + control-row 行距；移除上一版 fund-recon-* 紧凑 grid）。
               layout-mirrored 下 cell-left 视觉在右、cell-right 视觉在左：
                 row1 右=[开始运行]  左=pair[导入对账单, 导出文件]
                 row2 右=[场景管理]  左=pair[导入不平表, 导出文件]
                 row3 右=[链接表管理] 左=[状态框]
               v3.1.13：状态框移除 spark SVG，仅保留 status-box-text。
               v2.1.16-beta.5 需求1（PR-4 修订）：row2 右 cell 接到网关 ReconID 修复链路 ——
                 导入不平表 → reconIdFix.import({subMode:'gateway'})；
                 导出文件   → reconIdFix.export()（导出网关对账单修复文件）。
               🔴 资金红线：row2 不再有独立《开始运行》；改由 row1《开始运行》(bankStatementRunBtn) 按面板模式
                 (state.bankStatementProcessRunMode) 智能路由：'gateway'(最近一次导入不平表) → handleBankStatementGatewayReconRun()；
                 否则('bank'/默认，最近一次导入对账单) → handleBankStatementRun()（R1-R5 核心，绝不串引擎）。
               与「对账单 ReconID 修复」网关子模式共用同一 reconIdFixSession（后端零改动）。 -->
          <section id="bankStatementModulePanel" class="control-board module-panel bank-statement-board layout-mirrored" hidden>
            <div class="control-row">
              <div class="cell left">
                <button id="bankStatementRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
              </div>
              <div class="cell right">
                <!-- v2.1.16 A5：批量入口（多选 + 按表头识别路由，spec 2.3.1 两按钮布局 + 2.4.2 导入即批量）。单选 1 个文件是批量的子集，行为等同原单选导入。
                     v3.0.7 C4：按钮文案「导入对账单」→「导入文件」（id/handler/IPC 不变）；C5：导入 IPC 升级为通用导入（识别+路由+落库桥接）。布局保持两按钮（导入文件 / 导出文件）。 -->
                <div class="pending-action-pair">
                  <button id="bankStatementImportBtn" class="primary-btn" type="button">导入文件</button>
                  <button id="bankStatementExportBtn" class="secondary-btn" type="button" disabled>导出文件</button>
                </div>
              </div>
            </div>
            <!-- v3.0.7：原 row2(场景管理)+row3(链接表管理/状态框) 合并为单 control-row（2 列 2 行 grid）。
                 ① 删除原 row2 网关按钮对（导入不平表 bankStatementGatewayReconImportBtn / 导出文件 bankStatementGatewayReconExportBtn）。
                 ② layout-mirrored(rtl) 下 col1(1fr) 视觉在右 = 场景管理(行1)/链接表管理(行2)，大小+位置与原 row2/row3 完全一致；
                    col2(1.4fr) 视觉在左 = 状态框，grid-row 跨两行 + 单元格 align-self:stretch →
                    上沿对齐场景管理上沿、下沿对齐原状态框下沿（垂直高度增大，不再被 min-height:110 钉死居中）。
                 详见 styles-gemini-extra.css .bank-statement-board-merged-row 注释。 -->
            <div class="control-row bank-statement-board-merged-row">
              <div class="cell left bsb-merged-scenario">
                <button id="bankStatementScenarioBtn" class="secondary-btn" type="button">场景管理</button>
              </div>
              <div class="cell left bsb-merged-linked">
                <button id="bankStatementLinkedTableBtn" class="secondary-btn" type="button">链接表管理</button>
              </div>
              <div class="cell right bsb-merged-status">
                <div id="bankStatementStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v3.0.14：前置资金对账复用资金对账数据处理的五槽位结构：
               导入/导出/运行/场景/链接槽位分别放下拉框/链接表管理/导入文件/开始运行/导出文件。
               临时 MPT 账单统一从「链接表管理 -> 导入」进入；3.0.14 仅开放“缺网关账单”。 -->
          <section id="preFundReconciliationModulePanel" class="control-board module-panel bank-statement-board layout-mirrored" hidden>
            <div class="control-row">
              <div class="cell left">
                <button id="preFundReconciliationImportBankBtn" class="primary-btn" type="button">导入文件</button>
              </div>
              <div class="cell right">
                <div class="pending-action-pair pre-fund-action-pair">
                  <div class="pre-fund-scenario-slot">
                    <label class="select-label main-panel-select-label pre-fund-scenario-label" for="preFundReconciliationScenarioSelect">对账场景</label>
                    <div class="select-shell pre-fund-scenario-select-shell">
                      <select id="preFundReconciliationScenarioSelect" class="template-select main-panel-select-control">
                        <option value="missing-gateway" selected>缺网关账单</option>
                      </select>
                    </div>
                  </div>
                  <button id="preFundReconciliationTempManagerBtn" class="secondary-btn" type="button">链接表管理</button>
                </div>
              </div>
            </div>
            <div class="control-row pre-fund-board-merged-row">
              <div class="cell left pre-fund-merged-run">
                <button id="preFundReconciliationRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
              </div>
              <div class="cell left pre-fund-merged-export">
                <button id="preFundReconciliationExportBtn" class="secondary-btn" type="button" disabled>导出文件</button>
              </div>
              <div class="cell right pre-fund-merged-status">
                <div id="preFundReconciliationStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v2.1.0-beta.1 PR-A：单据对账 ReconID 修复模块面板（fork bankStatementModulePanel）
               v2.1.0-beta.2 PR-B（task B1）：行 1 左 cell = [场景下拉 + 场景管理]，行 1 右 cell = [导入文件 + 开始运行]
               v2.1.0-beta.3 T3：行 1 左 cell"场景下拉"位置 → 账单类别下拉；"场景及其下拉框"下移至与"导出文件"按钮平行（行 2 左 cell）；场景管理按钮 保持在 行 1 左 cell（与账单类别同组，沿用 beta.2 视觉对齐）；其他前端结构同 beta.2 版本 -->
          <section id="reconIdFixModulePanel" class="control-board module-panel bank-statement-board recon-id-fix-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <div class="recon-id-fix-bill-category-row">
                  <label class="recon-id-fix-bill-category-label main-panel-select-label" for="reconIdFixBillCategorySelect">账单类别</label>
                  <select id="reconIdFixBillCategorySelect" class="recon-id-fix-bill-category-select main-panel-select-control">
                    <option value="gateway" selected>网关对账单</option>
                    <option value="business">单据对账单</option>
                  </select>
                  <button id="reconIdFixManageScenariosBtn" class="secondary-btn" type="button" disabled>场景管理</button>
                </div>
              </div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="reconIdFixImportBtn" class="primary-btn" type="button" disabled>导入文件</button>
                  <button id="reconIdFixRunBtn" class="primary-btn" type="button" disabled>开始运行</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <!-- 行 2 左 cell：[场景 label + 场景下拉 + 导出文件]（场景与导出文件平行）；按钮 disabled 由 updateReconIdFixPanelVisibility 控制 -->
                <div id="reconIdFixScenarioRow" class="recon-id-fix-scenario-row">
                  <label class="recon-id-fix-scenario-label main-panel-select-label" for="reconIdFixScenarioSelect">场景</label>
                  <select id="reconIdFixScenarioSelect" class="recon-id-fix-scenario-select main-panel-select-control" disabled>
                    <!-- v2.1.0-beta.3 修订（用户反馈）：初始空白 option，待 state 加载后由 renderReconIdFixScenarioSelect 重写 -->
                    <option value=""></option>
                  </select>
                  <button id="reconIdFixExportBtn" class="secondary-btn" type="button" disabled>导出文件</button>
                </div>
              </div>
              <div class="cell right">
                <div id="reconIdFixStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v3.1.0：平盘对账数据处理第一期交付资金性质校验，继续复用对账单修复两行结构。 -->
          <section id="positionReconciliationModulePanel" class="control-board module-panel bank-statement-board recon-id-fix-board position-reconciliation-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <div class="recon-id-fix-bill-category-row position-reconciliation-function-row">
                  <label class="recon-id-fix-bill-category-label main-panel-select-label" for="positionReconciliationFunctionSelect">功能</label>
                  <select id="positionReconciliationFunctionSelect" class="recon-id-fix-bill-category-select main-panel-select-control">
                    <option value="position-fund-nature-check" selected>平盘资金性质校验</option>
                    <option value="position-data-info-backfill">平盘对账数据处理</option>
                    <option value="position-order-writeoff">平盘订单销账处理</option>
                  </select>
                  <button id="positionReconciliationRunBtn" class="primary-btn" type="button">开始运行</button>
                </div>
              </div>
              <div class="cell right">
                <div class="pending-action-pair">
                  <button id="positionReconciliationTableManagerBtn" class="secondary-btn" type="button">对账数据管理</button>
                  <button id="positionReconciliationLinkedTableManagerBtn" class="secondary-btn" type="button">链接表管理</button>
                </div>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <div class="recon-id-fix-scenario-row position-reconciliation-config-row">
                  <span class="position-reconciliation-empty-label" aria-hidden="true"></span>
                  <button id="positionReconciliationConfigBtn" class="secondary-btn" type="button">对账配置管理</button>
                  <button id="positionReconciliationExportBtn" class="secondary-btn" type="button">结果确认</button>
                </div>
              </div>
              <div class="cell right">
                <div id="positionReconciliationStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
            </div>
          </section>

          <!-- v2.1.6 Module B：收单单据币种校验模块面板（spec v0.8 §3.5 / §8.1，fix5 删月份下拉）
               流程：导入流水/单据时弹「选择对账月份」弹窗 → 选文件 → 跑对账 → 跑 run 时自动生成 diff/report → 导出差异 = 另存为 -->
          <!-- v2.1.6 fix14（spec v0.15 §8.1）：以 bankStatementModulePanel 为模板左右镜像
               grid-template-columns 在 .acquiring-bill-currency-board 内是 1.4fr 1fr（bank-statement 原版是 1fr 1.4fr，镜像 = 调换比例）
               按钮 ID 全部保留与 fix5 一致：ImportFlowBtn / ImportBillBtn / RunBtn / ExportBtn / StatusBox -->
          <section id="acquiringBillCurrencyModulePanel" class="control-board module-panel acquiring-bill-currency-board" hidden>
            <div class="control-row">
              <div class="cell left">
                <div class="pending-action-pair">
                  <button id="acquiringBillCurrencyImportFlowBtn" class="primary-btn" type="button">导入流水表</button>
                  <button id="acquiringBillCurrencyImportBillBtn" class="primary-btn" type="button">导入单据表</button>
                </div>
              </div>
              <div class="cell right">
                <button id="acquiringBillCurrencyRunBtn" class="primary-btn" type="button">开始运行</button>
              </div>
            </div>
            <div class="control-row">
              <div class="cell left">
                <div id="acquiringBillCurrencyStatusBox" class="status-box">
                  <span class="status-box-content">
                    <span class="status-box-text">欢迎使用小助手</span>
                  </span>
                </div>
              </div>
              <div class="cell right">
                <button id="acquiringBillCurrencyExportBtn" class="secondary-btn" type="button">导出差异</button>
              </div>
            </div>
          </section>
        </section>
      </main>
